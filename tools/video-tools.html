<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Tools</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#F6F4FB;--bg2:#ECE8F6;--pn:#fff;--ink:#1A1530;--mut:#665F80;--ln:#E0DAF0;--ac:#7C3AED;--ac2:#EFE7FE;--on:#fff;--bad:#C62828;--c1:#7C3AED;--c2:#DB2777;--c3:#0E9F8E;--c4:#EA580C;--c5:#2563EB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0B16;--bg2:#08070F;--pn:#171326;--ink:#EEEAFB;--mut:#A39BC2;--ln:#2C2644;--ac:#B79BFF;--ac2:#241B40;--on:#150B30;--bad:#FF8A80;--c1:#B79BFF;--c2:#FF8FC0;--c3:#4FD8C6;--c4:#FFA06B;--c5:#7DB1FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0B16;--bg2:#08070F;--pn:#171326;--ink:#EEEAFB;--mut:#A39BC2;--ln:#2C2644;--ac:#B79BFF;--ac2:#241B40;--on:#150B30;--bad:#FF8A80;--c1:#B79BFF;--c2:#FF8FC0;--c3:#4FD8C6;--c4:#FFA06B;--c5:#7DB1FF;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,dialog{font:inherit;color:inherit}
button{--cc:var(--ac);background:color-mix(in srgb,var(--cc) 11%,var(--pn));color:var(--ink);border:1.5px solid color-mix(in srgb,var(--cc) 32%,transparent);border-radius:12px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:600;transition:transform .12s,box-shadow .15s,background .15s,border-color .15s}
button:hover:not(:disabled){background:color-mix(in srgb,var(--cc) 22%,var(--pn));border-color:var(--cc);transform:translateY(-1px);box-shadow:0 8px 16px -10px var(--cc)}
button:active:not(:disabled){transform:scale(.95);box-shadow:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.p,button.p:hover:not(:disabled){background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px var(--c1),inset 0 1px 0 rgba(255,255,255,.3)}
button.dng{--cc:var(--bad);color:var(--bad)}
.ib{padding:8px 10px;border-radius:999px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button>svg.i:first-child{box-sizing:content-box;width:16px;height:16px;padding:6px;margin:-4px 0 -4px -8px;border-radius:10px;background:linear-gradient(140deg,var(--cc),color-mix(in srgb,var(--cc) 58%,#000));color:#fff;box-shadow:0 5px 10px -5px var(--cc)}
button.p>svg.i:first-child{background:rgba(255,255,255,.24);box-shadow:none}
.top button>svg.i:first-child,.ib>svg.i:first-child{width:18px;height:18px;padding:0;margin:0;background:none;box-shadow:none;color:var(--ac)}
.top button.p>svg.i:first-child{color:#fff}
:is(.r,.acts)>button:not(.p):not(.dng):nth-child(5n+1){--cc:var(--c1)}:is(.r,.acts)>button:not(.p):not(.dng):nth-child(5n+2){--cc:var(--c2)}:is(.r,.acts)>button:not(.p):not(.dng):nth-child(5n+3){--cc:var(--c3)}:is(.r,.acts)>button:not(.p):not(.dng):nth-child(5n+4){--cc:var(--c4)}
input[type=text]{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 11px;width:100%}
input[type=range]{accent-color:var(--ac);width:100%}
.top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:color-mix(in srgb,var(--pn) 90%,transparent);border-bottom:1px solid var(--ln);position:relative;z-index:5}
.brand{border:0;background:none;box-shadow:none;padding:2px;font-weight:800;font-size:18px;letter-spacing:-.02em}.brand:hover{transform:none!important;box-shadow:none!important;background:none!important}
.brand svg{width:34px;height:34px}.sp{flex:1}
.view{display:none;flex:1;min-height:0;flex-direction:column}.view.on{display:flex}
.wrap{max-width:1100px;width:100%;margin:0 auto;padding:18px 16px 30px;overflow:auto}
.hero{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--ln);border-radius:22px;padding:24px;background:radial-gradient(700px 220px at 100% 0,var(--ac2),transparent 70%),var(--pn);box-shadow:0 10px 30px -18px var(--c1)}
.hero.drag{outline:3px dashed var(--ac)}
.hero h1{margin:0 0 6px;font-size:clamp(22px,4vw,30px);line-height:1.15;letter-spacing:-.02em}.hero p{margin:0;color:var(--mut);max-width:520px}
.acts{display:flex;gap:10px;flex-wrap:wrap}.big{padding:12px 22px;font-size:15px}
.cur{margin-top:12px;font-weight:700;color:var(--ac);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip2{flex:none;border-radius:999px;padding:8px 16px;font-size:.88em;background:var(--pn)}
.chip2.on,.chip2.on:hover:not(:disabled){background:var(--cc);color:#fff;border-color:transparent}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-weight:800}.sec::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--cc)}.sec::after{content:"";flex:1;height:1px;background:var(--ln)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tc{flex-direction:column;justify-content:center;text-align:center;gap:10px;min-height:128px;padding:16px 8px;border-radius:18px;white-space:normal;background:color-mix(in srgb,var(--cc) 8%,var(--pn));border:1.5px solid color-mix(in srgb,var(--cc) 22%,transparent)}
.tc:hover:not(:disabled){transform:translateY(-4px);background:color-mix(in srgb,var(--cc) 14%,var(--pn));box-shadow:0 14px 26px -14px var(--cc)}
.tc b{font-size:.86em;line-height:1.25}
.ch{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,var(--cc),color-mix(in srgb,var(--cc) 58%,#000));color:#fff;box-shadow:0 8px 16px -8px var(--cc)}.ch .i{width:23px;height:23px;color:#fff}
.mut{color:var(--mut)}
.main{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;overflow:hidden;background:var(--bg2);background-image:repeating-conic-gradient(color-mix(in srgb,var(--mut) 10%,transparent) 0 25%,transparent 0 50%);background-size:20px 20px;display:flex;padding:12px}
#pv{width:100%;height:100%;object-fit:contain;display:block}
.ctl{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--pn);border-top:1px solid var(--ln)}.ctl small{min-width:92px;text-align:right;color:var(--mut);font-weight:600}
.pn{flex:none;background:var(--pn);border-top:1px solid var(--ln);box-shadow:0 -8px 24px -16px rgba(0,0,0,.4);border-radius:18px 18px 0 0;max-height:38vh;display:flex;flex-direction:column}
.pnh{display:flex;align-items:center;gap:8px;padding:10px 14px 4px}.pnh b{font-size:15px}.pnh small{color:var(--mut)}
.pnb{overflow:auto;padding:4px 16px 12px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.r>*{flex:none}
.plab{font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 3px}
.rg{display:flex;align-items:center;gap:10px}.rg b{min-width:58px;text-align:right;font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 13px}
.seg button.on,.seg button.on:hover:not(:disabled){background:linear-gradient(140deg,var(--cc),color-mix(in srgb,var(--cc) 62%,#000));color:#fff;border-color:transparent;box-shadow:0 6px 12px -6px var(--cc)}
.seg button:nth-child(5n+1){--cc:var(--c1)}.seg button:nth-child(5n+2){--cc:var(--c2)}.seg button:nth-child(5n+3){--cc:var(--c3)}.seg button:nth-child(5n+4){--cc:var(--c4)}.seg button:nth-child(5n+5){--cc:var(--c5)}
.note{background:var(--ac2);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.tools{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--pn);border-top:1px solid var(--ln);scrollbar-width:none}.tools::-webkit-scrollbar{display:none}
.tl{flex:none;flex-direction:column;gap:5px;min-width:68px;padding:9px 6px 7px;border-radius:16px;font-size:11.5px;line-height:1.1;white-space:normal;text-align:center;background:color-mix(in srgb,var(--cc) 9%,var(--pn));border:1.5px solid color-mix(in srgb,var(--cc) 25%,transparent)}
.tl .ch{width:34px;height:34px;border-radius:11px}.tl .ch .i{width:19px;height:19px}
.tl.on,.tl.on:hover:not(:disabled){background:color-mix(in srgb,var(--cc) 28%,var(--pn));border-color:var(--cc);box-shadow:inset 0 0 0 1.5px var(--cc)}
dialog{background:var(--pn);color:var(--ink);border:1px solid var(--ln);border-radius:20px;padding:20px;width:min(480px,94vw);max-height:92vh;overflow:auto;box-shadow:0 24px 60px -12px rgba(0,0,0,.5)}dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}dialog h3{margin:0 0 10px}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50}.bx{background:var(--pn);border-radius:18px;padding:22px 26px;min-width:250px;max-width:90vw;text-align:center}
.spin{width:34px;height:34px;border:4px solid var(--ln);border-top-color:var(--ac);border-radius:50%;margin:0 auto 12px;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
progress{width:100%;height:8px;accent-color:var(--ac)}
[hidden]{display:none!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;display:none;z-index:60;max-width:90vw;box-shadow:0 10px 30px -8px rgba(0,0,0,.5)}
@media (min-width:861px){#ws.on{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr) auto}#ws>.pn{max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--ln)}#ws>.tools{grid-column:1/-1}}
@media (max-width:480px){.brand span{display:none}.top{gap:6px;padding:8px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
 <button class="brand" id="home" aria-label="Beranda"><svg viewBox="0 0 34 34"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset="1" style="stop-color:var(--c2)"/></linearGradient></defs><rect width="34" height="34" rx="10" fill="url(#lg)"/><path d="M13 10.5v13l11-6.5z" fill="#fff"/></svg><span>Video Tools</span></button>
 <div class="sp"></div>
 <button id="chg" hidden>Ganti video</button>
 <button class="ib" id="th" aria-label="Ganti tema"></button>
</header>

<main id="hm" class="view on"><div class="wrap">
 <div class="hero" id="hero">
  <div><h1>Edit video langsung di browser</h1><p>Upscale, downscale, kompres, pangkas, dan banyak lagi. Video tidak diunggah ke mana pun, semua diproses di perangkatmu.</p><div class="cur" id="cur"></div></div>
  <div class="acts"><button class="p big" id="pick"></button></div>
 </div>
 <div class="chips" id="chips"></div>
 <div id="cd"></div>
</div></main>

<section id="ws" class="view">
 <div class="main">
  <div class="stage"><canvas id="pv"></canvas></div>
  <div class="ctl"><button class="ib" id="pl" aria-label="Putar"></button><input type="range" id="sk" min="0" max="1" step="0.01" value="0" aria-label="Posisi video"><small id="tm"></small></div>
 </div>
 <div class="pn"><div class="pnh"><b id="pt"></b><span class="sp"></span><small id="vi"></small></div><div class="pnb" id="pb"></div></div>
 <nav class="tools" id="tb"></nav>
</section>

<input type="file" id="fi" accept="video/*" hidden><input type="file" id="fm" accept="video/*" multiple hidden>
<div id="busy" hidden><div class="bx"><div class="spin"></div><b>Memproses video…</b><progress id="bp" max="1" value="0"></progress><div class="mut" id="bt">0%</div><p class="mut" style="font-size:12px;margin:6px 0 12px">Diproses secara real-time. Biarkan tab ini tetap terbuka.</p><button class="dng" id="bc">Batal</button></div></div>
<dialog id="rd"><h3>Selesai</h3><div id="rv"></div><div class="note" id="rs"></div><div class="r"><button class="p big" id="dl"></button><button id="sh">Bagikan</button><button id="rc">Tutup</button></div></dialog>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),R=document.documentElement;
const IC={
 up:'<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
 down:'<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>',
 zip:'<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',
 cut:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/>',
 spd:'<path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>',
 rot:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
 crp:'<path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/>',
 mut:'<path d="M11 5L6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6"/>',
 mus:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
 cam:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
 fx:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
 txt:'<path d="M4 7V4h16v3M9 20h6M12 4v16"/>',
 pre:'<path d="M13 2L3 14h9l-1 8 10-12h-9z"/>',fade:'<path d="M12 3C8 8 6 11 6 14a6 6 0 0 0 12 0c0-3-2-6-6-11z"/>',mrg:'<path d="M3 6h7v12H3zM14 6h7v12h-7z"/>',smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',film:'<rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/>',
 dl:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
 play:'<path d="M6 4l14 8-14 8z"/>',
 pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'};
const ic=n=>'<svg class="i" viewBox="0 0 24 24">'+IC[n]+'</svg>';
const G=[['all','Semua',1],['res','Resolusi',1],['edt','Edit',2],['aud','Audio',3],['fx','Efek',4],['cap','Ambil',5]];
const T=[
 {id:'pre',n:'Preset sosmed',g:'res',c:4,i:'pre'},{id:'up',n:'Upscale video',g:'res',c:1,i:'up'},{id:'down',n:'Downscale video',g:'res',c:2,i:'down'},{id:'zip',n:'Kompres video',g:'res',c:3,i:'zip'},
 {id:'cut',n:'Pangkas durasi',g:'edt',c:4,i:'cut'},{id:'spd',n:'Kecepatan',g:'edt',c:5,i:'spd'},{id:'fade',n:'Fade in/out',g:'edt',c:3,i:'fade'},{id:'rot',n:'Putar & balik',g:'edt',c:1,i:'rot'},{id:'crp',n:'Pangkas bingkai',g:'edt',c:2,i:'crp'},
 {id:'mut',n:'Volume & bisu',g:'aud',c:3,i:'mut'},{id:'aud',n:'Ekstrak audio',g:'aud',c:4,i:'mus'},
 {id:'fx',n:'Filter warna',g:'fx',c:5,i:'fx'},{id:'wm',n:'Watermark teks',g:'fx',c:1,i:'txt'},
 {id:'dur',n:'Atur durasi',g:'edt',c:3,i:'spd'},{id:'rev',n:'Reverse & boomerang',g:'edt',c:1,i:'rot'},{id:'mrg',n:'Gabung video',g:'edt',c:2,i:'mrg'},{id:'gif',n:'Video ke GIF',g:'cap',c:3,i:'film'},{id:'wsk',n:'Stiker WA (video)',g:'cap',c:4,i:'smile'},{id:'frm',n:'Ambil gambar',g:'cap',c:2,i:'cam'}];
let V=null,vid=null,S={},cur=null,pend=null,AC=null,sN,pg,rg,dst,busyF=0,cancel=0,cg='all',RU=null,RN='',RB=null,MC=[],sd=0,tt;
const SH='url("data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cfilter id=%27s%27%3E%3CfeConvolveMatrix order=%273%27 kernelMatrix=%270 -.5 0 -.5 3 -.5 0 -.5 0%27 preserveAlpha=%27true%27/%3E%3C/filter%3E%3C/svg%3E#s")';
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600)};
const tf=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0')};
const fb=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB';
const ev=n=>Math.max(2,Math.round(n/2)*2);
const D=()=>({start:0,end:V.dur,spd:1,rot:0,fh:0,fv:0,asp:0,tgt:'x1',mut:0,vol:1,kbps:0,br:1,co:1,sa:1,gr:0,se:0,bl:0,sharp:0,hue:0,inv:0,fit:0,fi:0,fo:0,fps:30,fmt:'auto',tdur:15,rv:0,wt:'',wp:'br',ws:6,wo:.8});

/* ---------- tema & ikon ---------- */
$('#th').innerHTML=ic('sun');$('#pick').innerHTML=ic('film')+'Pilih video';$('#dl').innerHTML=ic('dl')+'Unduh';$('#pl').innerHTML=ic('play');
$('#th').onclick=()=>{const d=R.dataset.theme?R.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;R.dataset.theme=d?'light':'dark'};

/* ---------- beranda ---------- */
function home(){
 $('#chips').innerHTML=G.map(([k,l,c])=>`<button class="chip2${cg===k?' on':''}" data-g="${k}" style="--cc:var(--c${c})">${l}</button>`).join('');
 $('#cd').innerHTML=G.slice(1).filter(x=>cg==='all'||cg===x[0]).map(([k,l,c])=>`<div class="sec" style="--cc:var(--c${c})">${l}</div><div class="cards">`+T.filter(t=>t.g===k).map(t=>`<button class="tc" data-t="${t.id}" style="--cc:var(--c${t.c})"><span class="ch">${ic(t.i)}</span><b>${t.n}</b></button>`).join('')+'</div>').join('');
 $('#cur').textContent=V?`${V.name} · ${V.w}×${V.h} · ${tf(V.dur)} · ${fb(V.size)}`:'';
}
$('#chips').onclick=e=>{const b=e.target.closest('[data-g]');if(b){cg=b.dataset.g;home()}};
$('#cd').onclick=e=>{const b=e.target.closest('[data-t]');if(b)sel(b.dataset.t)};
$('#pick').onclick=$('#chg').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{load(e.target.files[0]);e.target.value=''};
$('#home').onclick=()=>{vid&&vid.pause();show('hm')};
const hero=$('#hero');
['dragover','dragenter'].forEach(v=>addEventListener(v,e=>{e.preventDefault();hero.classList.add('drag')}));
['dragleave','drop'].forEach(v=>addEventListener(v,e=>{e.preventDefault();hero.classList.remove('drag');if(v==='drop'&&e.dataTransfer.files[0])load(e.dataTransfer.files[0])}));
function show(v){$('#hm').classList.toggle('on',v==='hm');$('#ws').classList.toggle('on',v==='ws')}

/* ---------- muat video ---------- */
function load(f){
 if(!f)return;
 if(!/^video\//.test(f.type)&&!/\.(mp4|webm|mov|mkv|m4v|ogv)$/i.test(f.name))return toast('Pilih file video (MP4, WebM, MOV).');
 if(busyF)return;
 if(V)URL.revokeObjectURL(V.url);if(vid)vid.remove();if(AC)AC.close();AC=null;
 const v=document.createElement('video'),url=URL.createObjectURL(f);
 v.preload='auto';v.playsInline=true;v.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px';
 v.onloadedmetadata=()=>{
  V={url,name:f.name,size:f.size,w:v.videoWidth,h:v.videoHeight,dur:v.duration};
  $('#chg').hidden=false;home();

function geom(){
 let sx=0,sy=0,sw=V.w,sh=V.h;const a=S.asp,fit=a&&S.fit;
 if(a&&!fit){if(sw/sh>a){const nw=sh*a;sx=(sw-nw)/2;sw=nw}else{const nh=sw/a;sy=(sh-nh)/2;sh=nh}}
 const q=S.rot%180!==0,rw=q?sh:sw,rh=q?sw:sh,t=S.tgt||'x1';
 let cw=rw,ch=rh;if(fit){if(rw/rh>a)ch=rw/a;else cw=rh*a}
 let f=t[0]==='x'?+t.slice(1):+t.slice(1)/Math.min(cw,ch);if(cur==='down'||cur==='zip')f=Math.min(f,1);
 return{sx,sy,sw,sh,rw,rh,fit,W:ev(cw*f),H:ev(ch*f)};
}
function filt(k){
 const f=[`brightness(${S.br})`,`contrast(${S.co})`,`saturate(${S.sa})`];
 if(S.gr)f.push(`grayscale(${S.gr})`);if(S.se)f.push(`sepia(${S.se})`);if(S.hue)f.push(`hue-rotate(${S.hue}deg)`);if(S.inv)f.push(`invert(${S.inv})`);if(S.bl)f.push(`blur(${S.bl*k}px)`);if(S.sharp)f.push(SH);

}

 c.drawImage(vid,g.sx,g.sy,g.sw,g.sh,-dw/2,-dh/2,dw,dh);c.restore();
}

 c.save();c.clearRect(0,0,W,H);c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
 let w=W,h=H;
 if(g.fit){const s=Math.min(W/g.rw,H/g.rh);w=g.rw*s;h=g.rh*s;
  if(S.fit===2){const b=Math.max(W/g.rw,H/g.rh);drawV(c,W/2,H/2,g.rw*b,g.rh*b,g,'blur('+24*k+'px) brightness(.6)')}else if(S.fit===1){c.fillStyle='#000';c.fillRect(0,0,W,H)}}

  c.font='800 '+fs+'px "Plus Jakarta Sans",system-ui,sans-serif';c.fillStyle='#fff';c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=fs/4;c.textBaseline='middle';
  c.textAlign=p==='c'?'center':p[1]==='l'?'left':'right';
  c.fillText(S.wt,p==='c'?W/2:p[1]==='l'?m:W-m,p==='c'?H/2:p[0]==='t'?m+fs/2:H-m-fs/2);c.restore()}
}
function fade(t){const r=t-S.start,d=S.end-S.start;let a=0;if(S.fi&&r<S.fi)a=1-r/S.fi;if(S.fo&&d-r<S.fo)a=Math.max(a,1-(d-r)/S.fo);return Math.max(0,Math.min(1,a))}

 if(busyF)return;
 if(S.end-S.start<.2)return toast('Durasi terlalu pendek.');

 let rec;

 catch(e){busyF=0;pg.gain.value=1;return toast('Gagal memulai perekaman: '+e.message)}
 const ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 const done=new Promise(r=>rec.onstop=r);
 $('#busy').hidden=false;$('#bp').value=0;$('#bt').textContent='0%';
 rec.start(500);vid.playbackRate=m==='v'?S.spd:1;
 try{await vid.play()}catch(e){cancel=1}
 await new Promise(res=>{(function f(){
  const t=vid.currentTime;const fa=fade(t);rg.gain.value=(S.mut?0:S.vol)*(1-fa);if(m==='v'){draw(c,g.W,g.H,g,1);if(fa>0){c.fillStyle='rgba(0,0,0,'+fa+')';c.fillRect(0,0,g.W,g.H)}}
  const p=Math.max(0,Math.min(1,(t-S.start)/(S.end-S.start)));$('#bp').value=p;$('#bt').textContent=Math.round(p*100)+'%';
  if(cancel||t>=S.end-.03||vid.ended)res();else requestAnimationFrame(f)})()});

 if(cancel)return toast('Dibatalkan.');

}

const enc=async f=>{$('#busy').hidden=false;$('#bt').textContent='Mengemas…';await new Promise(r=>setTimeout(r,40));try{return await f()}finally{$('#busy').hidden=true}};
async function capture(fps,maxD,g){
 if(busyF)return;if(S.end-S.start<.2){toast('Durasi terlalu pendek.');return}
 busyF=1;cancel=0;vid.pause();vid.muted=true;await seek(S.start);
 const end=Math.min(S.end,S.start+maxD),fr=[];let nx=S.start;
 $('#busy').hidden=false;vid.playbackRate=S.spd;
 try{await vid.play()}catch(e){cancel=2}
 await new Promise(res=>{(function f(){const t=vid.currentTime;
  if(t>=nx&&nx<end){const c=document.createElement('canvas');c.width=g.W;c.height=g.H;draw(c.getContext('2d'),g.W,g.H,g,1);fr.push(c);nx+=S.spd/fps}
  const p=Math.min(1,(t-S.start)/(end-S.start));$('#bp').value=p;$('#bt').textContent=Math.round(p*100)+'%';
  if(cancel||t>=end-.02||vid.ended)res();else requestAnimationFrame(f)})()});
 vid.pause();vid.muted=false;vid.playbackRate=1;busyF=0;$('#busy').hidden=true;seek(S.start);
 if(cancel){toast(cancel===2?'Video tidak bisa diputar otomatis. Ketuk tombol putar sekali, lalu coba lagi.':'Dibatalkan.');return}
 return fr}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5],cl=v=>Math.max(0,Math.min(5,Math.round(v/51)));
function lzw(px,o){let bits=0,cur=0,buf=[],n=9,next=258,d=new Map();
 const put=c=>{cur|=c<<bits;bits+=n;while(bits>=8){buf.push(cur&255);cur>>=8;bits-=8;if(buf.length===255){o.push(255,...buf);buf=[]}}};
 put(256);let pre=px[0];
 for(let i=1;i<px.length;i++){const k=px[i],key=pre<<8|k,v=d.get(key);
  if(v!==undefined)pre=v;else{put(pre);if(next<4096){d.set(key,next++);if(next>(1<<n)&&n<12)n++}else{put(256);d.clear();next=258;n=9}pre=k}}
 put(pre);put(257);if(bits>0)buf.push(cur&255);if(buf.length)o.push(buf.length,...buf);o.push(0)}
function gif(fr,dl){const W=fr[0].width,H=fr[0].height,o=[],b=n=>o.push(n&255),w=n=>{b(n);b(n>>8)};
 [...'GIF89a'].forEach(c=>b(c.charCodeAt(0)));w(W);w(H);b(247);b(0);b(0);
 for(let i=0;i<256;i++){b(i<216?(i/36|0)*51:0);b(i<216?((i/6|0)%6)*51:0);b(i<216?(i%6)*51:0)}
 b(33);b(255);b(11);[...'NETSCAPE2.0'].forEach(c=>b(c.charCodeAt(0)));b(3);b(1);w(0);b(0);
 for(const c of fr){const d=c.getContext('2d').getImageData(0,0,W,H).data,px=new Uint8Array(W*H);
  for(let y=0,p=0;y<H;y++)for(let x=0;x<W;x++,p++){const i=p*4,t=(BAY[(y&3)*4+(x&3)]-7.5)*3.2;px[p]=cl(d[i]+t)*36+cl(d[i+1]+t)*6+cl(d[i+2]+t)}
  b(33);b(249);b(4);b(0);w(dl);b(0);b(0);b(44);w(0);w(0);w(W);w(H);b(0);b(8);lzw(px,o)}
 b(59);return new Blob([new Uint8Array(o)],{type:'image/gif'})}
async function runGif(){const g=geom(),fr=await capture(S.fps,12,g);if(!fr||!fr.length)return toast('Tidak ada frame yang berhasil diambil.');result(await enc(()=>gif(fr,Math.max(2,Math.round(100/S.fps)))),g,'g')}
const cat=a=>{const o=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o},w3=(n,l)=>Array.from({length:l},(_,i)=>(n>>(8*i))&255);
const ck=(id,d)=>cat([new Uint8Array([...id].map(c=>c.charCodeAt(0))),new Uint8Array(w3(d.length,4)),d,new Uint8Array(d.length&1?[0]:[])]);
async function awebp(fr,dl,q){const W=fr[0].width,H=fr[0].height,F=[];
 for(const c of fr){const u=new Uint8Array(await(await blobOf(c,'image/webp',q)).arrayBuffer()),img=[];let o=12;
  while(o<u.length){const id=String.fromCharCode(...u.slice(o,o+4)),sz=u[o+4]|u[o+5]<<8|u[o+6]<<16,len=8+sz+(sz&1);if(id==='VP8 '||id==='VP8L'||id==='ALPH')img.push(u.slice(o,o+len));o+=len}
  F.push(ck('ANMF',cat([new Uint8Array([0,0,0,0,0,0,...w3(W-1,3),...w3(H-1,3),...w3(dl,3),3]),...img])))}
 const body=cat([new Uint8Array([87,69,66,80]),ck('VP8X',new Uint8Array([18,0,0,0,...w3(W-1,3),...w3(H-1,3)])),ck('ANIM',new Uint8Array(6)),...F]);
 return new Blob([cat([new Uint8Array([82,73,70,70,...w3(body.length,4)]),body])],{type:'image/webp'})}
const blobOf=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
async function fitWebp(fr,fps){let x,n=fr.length;
 for(;;){const L=fr.slice(0,n);
  for(const[st,q]of[[1,.6],[1,.45],[1,.3],[1,.2],[2,.3],[2,.15]]){
   $('#bt').textContent='Menyesuaikan stiker…';x=await awebp(L.filter((_,i)=>i%st===0),Math.round(1000*st/fps),q);
   if(x.size<=5e5)return{b:x,sec:n/fps}}
  if(n<=fps*2)return{b:x,sec:n/fps};n=Math.floor(n*.85)}}
async function runWsk(share){
 if(!document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp'))return toast('Browser ini tidak bisa membuat WebP. Pakai Chrome atau Edge.');
 const g=geom(),fr=await capture(S.fps,MAXD.wsk,g);if(!fr)return;if(!fr.length)return toast('Tidak ada frame yang berhasil diambil.');
 let r;try{r=await enc(()=>fitWebp(fr,S.fps))}catch(e){return toast('Gagal membuat stiker: '+e.message)}
 const want=fr.length/S.fps;result(r.b,g,'s');
 $('#rs').textContent='Stiker '+g.W+'×'+g.H+' · durasi '+r.sec.toFixed(1)+' detik'+(r.sec<want-.2?' (dipersingkat dari '+want.toFixed(1)+' detik agar diterima WhatsApp)':'')+(share?'. Ketuk Bagikan untuk mengirim ke WhatsApp.':'. Ketuk Unduh untuk menyimpan.')}
async function runRev(){
 const g=geom(),fps=S.fps,fr=await capture(fps,20,g);if(!fr||!fr.length)return toast('Tidak ada frame yang berhasil diambil.');
 const mt=mime('v');if(!mt)return toast('Browser ini tidak mendukung perekaman video.');
 const seq=S.rv?fr.concat(fr.slice(1,-1).reverse()):fr.slice().reverse(),en=Math.min(S.end,S.start+20);
 busyF=1;cancel=0;initAudio();await AC.resume();rg.gain.value=S.mut?0:S.vol;
 const cv=document.createElement('canvas');cv.width=g.W;cv.height=g.H;const c=cv.getContext('2d'),st=cv.captureStream(fps);let src=null;
 if(!S.rv){try{const buf=await AC.decodeAudioData(await(await fetch(V.url)).arrayBuffer());for(let i=0;i<buf.numberOfChannels;i++)buf.getChannelData(i).reverse();src=AC.createBufferSource();src.buffer=buf;src.playbackRate.value=S.spd;src.connect(rg);dst.stream.getAudioTracks().forEach(t=>st.addTrack(t))}catch(e){src=null}}
 const rec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:Math.round(g.W*g.H*fps*.1)}),ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);const done=new Promise(r=>rec.onstop=r);
 $('#busy').hidden=false;$('#bt').textContent='Membalik…';rec.start(500);if(src)src.start(0,Math.max(0,V.dur-en),en-S.start);
 const t0=performance.now();
 for(let i=0;i<seq.length&&!cancel;i++){while(performance.now()-t0<i*1000/fps)await new Promise(requestAnimationFrame);c.drawImage(seq[i],0,0);$('#bp').value=i/seq.length}
 await new Promise(r=>setTimeout(r,200));if(src)try{src.stop()}catch(e){}
 rec.stop();await done;busyF=0;$('#busy').hidden=true;
 if(cancel)return toast('Dibatalkan.');
 result(new Blob(ch,{type:mt.split(';')[0]}),g,'v')}
async function runMrg(){
 if(busyF)return;if(MC.length<2)return toast('Tambahkan minimal 2 video.');
 const mt=mime('v');if(!mt)return toast('Browser ini tidak mendukung perekaman video.');
 const a=MC[0],f=+S.tgt.slice(1)/Math.min(a.w,a.h),W=ev(a.w*f),H=ev(a.h*f);
 busyF=1;cancel=0;const ac=new AudioContext(),d=ac.createMediaStreamDestination(),cv=document.createElement('canvas');cv.width=W;cv.height=H;
 const c=cv.getContext('2d'),st=cv.captureStream(S.fps);d.stream.getAudioTracks().forEach(x=>st.addTrack(x));
 const rec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:Math.round(W*H*30*.07),audioBitsPerSecond:128e3}),ch=[];
 rec.ondataavailable=e=>e.data.size&&ch.push(e.data);const done=new Promise(r=>rec.onstop=r);
 $('#busy').hidden=false;$('#bt').textContent='Menggabungkan…';rec.start(500);await ac.resume();
 for(let i=0;i<MC.length&&!cancel;i++){
  const m=MC[i],v=document.createElement('video');v.playsInline=true;v.src=m.url;await new Promise(r=>{v.onloadeddata=r;v.onerror=r});
  ac.createMediaElementSource(v).connect(d);const s=Math.min(W/m.w,H/m.h),w=m.w*s,h=m.h*s;
  try{await v.play()}catch(e){continue}
  await new Promise(res=>{v.onended=res;(function fr(){if(cancel||v.ended)return res();c.fillStyle='#000';c.fillRect(0,0,W,H);c.drawImage(v,(W-w)/2,(H-h)/2,w,h);$('#bp').value=(i+v.currentTime/(m.dur||1))/MC.length;requestAnimationFrame(fr)})()});
  v.pause();v.removeAttribute('src')}
 rec.stop();await done;ac.close();busyF=0;$('#busy').hidden=true;
 if(cancel)return toast('Dibatalkan.');
 result(new Blob(ch,{type:mt.split(';')[0]}),{W,H},'v')}
function snap(type,ext){
 const g=geom(),cv=document.createElement('canvas');cv.width=g.W;cv.height=g.H;draw(cv.getContext('2d'),g.W,g.H,g,1);
 cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=V.name.replace(/\.[^.]+$/,'')+'-'+vid.currentTime.toFixed(1)+'s.'+ext;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Gambar disimpan.')},type,.95);
}
addEventListener('keydown',e=>{if(!V||busyF||!$('#ws').classList.contains('on')||/INPUT|BUTTON|DIALOG/.test(e.target.tagName))return;
