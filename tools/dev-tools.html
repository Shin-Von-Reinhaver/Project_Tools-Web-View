<!DOCTYPE html>

<head>
<meta charset="utf-8">

<style>
:root{--ac:#0B7A8F;--ac2:color-mix(in srgb,#0B7A8F 14%,#fff);--on:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac:#38BDF8;--ac2:color-mix(in srgb,#38BDF8 18%,#000);--on:#04202F}}
:root[data-theme="dark"]{--ac:#38BDF8;--ac2:color-mix(in srgb,#38BDF8 18%,#000);--on:#04202F}
*{box-sizing:border-box}
:root{--bg:#F6F4FB;--bg2:#ECE8F6;--pn:#fff;--ink:#1A1530;--mut:#665F80;--ln:#E0DAF0;--bad:#C62828;--ok:#15803d;--c1:var(--ac);--c2:#DB2777;--c3:#0E9F8E;--c4:#EA580C;--c5:#2563EB;--r:14px;--h:44px;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1318;--bg2:#0A0E12;--pn:#171E25;--ink:#E5ECF1;--mut:#93A2AE;--ln:#2A353F;--bad:#FF8A80;--ok:#4ADE80;--c2:#F472B6;--c3:#2DD4BF;--c4:#FB923C;--c5:#60A5FA;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1318;--bg2:#0A0E12;--pn:#171E25;--ink:#E5ECF1;--mut:#93A2AE;--ln:#2A353F;--bad:#FF8A80;--ok:#4ADE80;--c2:#F472B6;--c3:#2DD4BF;--c4:#FB923C;--c5:#60A5FA;color-scheme:dark}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln);flex:none}
.top .logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));color:var(--on);flex:none}
.top .logo .i{width:20px;height:20px}
.top h1{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.hb{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ln);background:var(--pn);color:var(--ink);text-decoration:none;font-weight:800;flex:none}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow:auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.wrapc{max-width:880px;margin:0 auto}
.tag{margin:0 0 12px;color:var(--mut)}
.srch{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1.5px solid var(--ln);border-radius:14px;background:var(--pn);margin:0 0 12px}
.srch:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.srch input[type=search]{flex:1;min-width:0;border:0;background:none;outline:0;height:100%;min-height:0;padding:0;font-size:15px}
.srch .i{color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 16px;border-radius:999px;border:1.5px solid var(--ln);background:var(--pn);font-weight:600;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.sec{display:flex;align-items:center;gap:10px;margin:20px 0 12px;font-weight:800;font-size:15px}
.sec::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--cc,var(--ac))}
.sec::after{content:"";flex:1;height:1px;background:var(--ln)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.cards{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.tc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-height:128px;padding:18px 10px 14px;border-radius:var(--r);border:1.5px solid color-mix(in srgb,var(--cc,var(--ac)) 30%,var(--ln));background:color-mix(in srgb,var(--cc,var(--ac)) 8%,var(--pn));transition:border-color .15s,transform .12s}
.tc:hover{border-color:var(--cc,var(--ac))}
.tc:active{transform:scale(.97)}
.tc .ch{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(140deg,var(--cc,var(--ac)),color-mix(in srgb,var(--cc,var(--ac)) 55%,#000));color:#fff;flex:none}
.tc .ch .i{width:22px;height:22px}
.tc b{font-size:13.5px;line-height:1.25;font-weight:700}
.tc small{font-size:12px;line-height:1.35;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.tbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--pn);border-bottom:1px solid var(--ln);flex:none}
.tbar h2{margin:0;font-size:17px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar .ib{display:inline-grid;place-items:center;width:var(--h);height:var(--h);border-radius:50%;border:1.5px solid var(--ln);background:var(--pn);flex:none}
.stage{display:flex;flex-direction:column;gap:14px}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.box>h3{margin:0;font-size:14px;font-weight:800}
.note{margin:0;font-size:13px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.row>.grow{flex:1 1 0;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:420px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--mut);min-width:0}
label.f.inl{flex-direction:row;align-items:center;gap:10px;font-size:13.5px;color:var(--ink);font-weight:600}
input[type=text],input[type=number],input[type=search],input[type=url],input[type=password],input[type=date],input[type=time],input[type=datetime-local],select,textarea{width:100%;min-height:var(--h);padding:0 12px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);font-size:14.5px;min-width:0}
textarea{padding:10px 12px;min-height:130px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
textarea.pl{font-family:inherit;font-size:14.5px}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac);min-height:28px}
input[type=color]{width:100%;height:var(--h);padding:3px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--ac);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--h);padding:0 16px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--cc,var(--ac)) 38%,var(--ln));background:color-mix(in srgb,var(--cc,var(--ac)) 10%,var(--pn));font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--cc,var(--ac))}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.p{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 88%,#fff),var(--ac));border-color:transparent;color:var(--on);min-height:48px}
.btn.s{min-height:36px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn.d{--cc:var(--bad);color:var(--bad)}
.btn.w{width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:40px;padding:0 14px;border-radius:11px;border:1.5px solid var(--ln);background:var(--bg);font-weight:600;font-size:13px}
.seg button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.out{position:relative;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto;min-height:44px}
.out.err{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--ln))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--ln)}
.stat small{color:var(--mut);font-size:12px;font-weight:600}.stat b{font-size:18px;font-weight:800;overflow-wrap:anywhere}
.mut{color:var(--mut)}.err{color:var(--bad)}.okc{color:var(--ok)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top;overflow-wrap:anywhere}
.tbl th{color:var(--mut);font-size:12px}
.scrollx{overflow-x:auto}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:130px;padding:20px;border:2px dashed var(--ln);border-radius:16px;background:var(--pn);text-align:center;color:var(--mut);cursor:pointer;transition:border-color .15s,background .15s;width:100%}
.drop:hover,.drop.drag{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--pn))}
.drop .i{width:30px;height:30px;color:var(--ac)}
.drop b{color:var(--ink)}
canvas.wave{width:100%;height:120px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);display:block;touch-action:none}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
.li .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:13.5px}
.li .nm small{display:block;color:var(--mut);font-weight:400}
.li button{min-height:34px;min-width:34px;padding:0 8px;border-radius:9px;border:1.5px solid var(--ln);background:var(--pn);display:inline-grid;place-items:center}
.res{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--ok) 50%,var(--ln));background:color-mix(in srgb,var(--ok) 8%,var(--pn))}
.res audio,.res video,.res img{width:100%;max-height:300px;border-radius:12px;background:var(--bg);object-fit:contain}
.prog{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--ln);overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:var(--ac);transition:width .15s}
mark.m{background:color-mix(in srgb,var(--ac) 35%,transparent);color:inherit;border-radius:3px}
.sw{display:inline-block;width:20px;height:20px;border-radius:6px;border:1px solid var(--ln);vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--ln);font-size:12px;font-weight:600}
.dif{font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.dif .a{background:color-mix(in srgb,var(--ok) 22%,transparent)}.dif .r{background:color-mix(in srgb,var(--bad) 22%,transparent)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90vw;padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;display:none;z-index:50;text-align:center}
#toast.on{display:block}
#toast.bad{background:var(--bad);color:#fff}
#busy{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(0,0,0,.5)}
#busy.on{display:grid}
#busy .bx{width:min(320px,86vw);padding:20px;border-radius:18px;background:var(--pn);display:flex;flex-direction:column;gap:12px;text-align:center}
.spin{width:30px;height:30px;margin:0 auto;border-radius:50%;border:3px solid var(--ln);border-top-color:var(--ac);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.row>label.f{flex:1 1 130px}
.bigbtn{width:100%;min-height:180px;border-radius:24px;border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--pn));font-size:64px;font-weight:800;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bigbtn:active{transform:scale(.98);background:color-mix(in srgb,var(--ac) 22%,var(--pn))}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.keys button{min-height:48px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);font-weight:700;font-size:16px}
.keys button.op{background:color-mix(in srgb,var(--ac) 14%,var(--bg));border-color:color-mix(in srgb,var(--ac) 40%,var(--ln))}
.keys button.eq{background:var(--ac);color:var(--on);border-color:transparent}
.disp{min-height:64px;padding:10px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--ln);text-align:right;overflow-wrap:anywhere}
.disp small{display:block;color:var(--mut);min-height:20px;font-size:13px}.disp b{font-size:28px;font-weight:800}

</style>
<style id="kit-css">
/* ===== KIT: tombol & panel Tampilan/Bahasa (dipakai semua halaman) ===== */
.kit-btn{display:inline-grid;place-items:center;width:42px;height:42px;padding:0;border-radius:50%;border:1.5px solid var(--ln,var(--line,rgba(128,128,150,.35)));background:var(--pn,var(--card2,transparent));color:var(--ac);cursor:pointer;flex:none;min-height:0!important}
.kit-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kit-btn:hover{border-color:var(--ac)}
#themeBtn.kit-hide,#th.kit-hide,.kit-hide{display:none!important}
.kit-ov{position:fixed;inset:0;z-index:2147483000;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.kit-ov.on{display:flex}
.kit-sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--pn,var(--bg2,#fff));color:var(--ink);border:1px solid var(--ln,var(--line,#ccc));border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-shadow:0 -20px 50px -20px rgba(0,0,0,.6);animation:kitUp .22s ease both}
@media(min-width:640px){.kit-ov{align-items:center}.kit-sheet{border-radius:22px}}
@keyframes kitUp{from{transform:translateY(24px);opacity:0}}
.kit-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.kit-h b{font-size:17px;font-weight:800}
.kit-x{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ln,var(--line,#ccc));background:none;color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.kit-sec{margin:16px 0 8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.kit-seg{display:flex;gap:8px;flex-wrap:wrap}
.kit-seg button,.kit-b{min-height:42px;padding:0 16px;border-radius:12px;border:1.5px solid var(--ln,var(--line,#ccc));background:transparent;color:var(--ink);font:600 13.5px/1 inherit;cursor:pointer;flex:1 1 auto}
.kit-seg button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.kit-sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.kit-sw button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px 9px;border-radius:14px;border:1.5px solid var(--ln,var(--line,#ccc));background:transparent;color:var(--ink);font:600 12px/1.1 inherit;cursor:pointer}
.kit-sw button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.kit-dots{display:flex;height:26px;width:62px;border-radius:9px;overflow:hidden;border:1px solid rgba(128,128,128,.35)}
.kit-dots i{flex:1}
.kit-b{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px}
.kit-note{font-size:12px;color:var(--mut);margin:8px 2px 0}
