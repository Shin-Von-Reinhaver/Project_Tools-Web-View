<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Image Tools</title>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Pacifico&family=Lobster&family=Bebas+Neue&family=Permanent+Marker&family=Dancing+Script:wght@700&family=Oswald:wght@700&family=Montserrat:wght@700&family=Caveat:wght@700&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Pacifico&family=Lobster&family=Bebas+Neue&family=Permanent+Marker&family=Dancing+Script:wght@700&family=Oswald:wght@700&family=Montserrat:wght@700&family=Caveat:wght@700&display=swap"></noscript>
<style>
:root{--bg:#F6F4FB;--bg2:#ECE8F6;--pn:#fff;--ink:#1A1530;--mut:#665F80;--ln:#E0DAF0;--ac:#7C3AED;--ac2:#EFE7FE;--on:#fff;--bad:#C62828;--c1:#7C3AED;--c2:#DB2777;--c3:#0E9F8E;--c4:#EA580C;--c5:#2563EB;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0B16;--bg2:#08070F;--pn:#171326;--ink:#EEEAFB;--mut:#A39BC2;--ln:#2C2644;--ac:#B79BFF;--ac2:#241B40;--on:#150B30;--bad:#FF8A80;--c1:#B79BFF;--c2:#FF8FC0;--c3:#4FD8C6;--c4:#FFA06B;--c5:#7DB1FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0B16;--bg2:#08070F;--pn:#171326;--ink:#EEEAFB;--mut:#A39BC2;--ln:#2C2644;--ac:#B79BFF;--ac2:#241B40;--on:#150B30;--bad:#FF8A80;--c1:#B79BFF;--c2:#FF8FC0;--c3:#4FD8C6;--c4:#FFA06B;--c5:#7DB1FF;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{background:color-mix(in srgb,var(--ac) 11%,var(--pn));color:var(--ink);border:1px solid color-mix(in srgb,var(--ac) 30%,var(--ln));border-radius:12px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:600;transition:transform .12s,box-shadow .15s,background .15s,border-color .15s}
button:hover:not(:disabled){background:color-mix(in srgb,var(--ac) 22%,var(--pn));border-color:var(--ac);transform:translateY(-1px);box-shadow:0 8px 16px -10px var(--ac)}
button:active:not(:disabled){transform:scale(.95);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
button.p,button.p:hover:not(:disabled){background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px var(--c1),inset 0 1px 0 rgba(255,255,255,.3)}
button.dng{background:color-mix(in srgb,var(--bad) 11%,var(--pn));border-color:color-mix(in srgb,var(--bad) 40%,var(--ln));color:var(--bad)}
.ib{padding:8px 10px;border-radius:999px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=text],input[type=number],select,textarea{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 11px;max-width:100%}
input[type=range]{accent-color:var(--ac);width:100%}
textarea{width:100%;min-height:64px}
.top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:color-mix(in srgb,var(--pn) 90%,transparent);border-bottom:1px solid var(--ln);position:relative;z-index:5}
.brand{border:0;background:none;box-shadow:none;padding:2px;font-weight:800;font-size:18px;letter-spacing:-.02em}.brand:hover{transform:none!important;box-shadow:none!important;background:none!important}
.brand svg{width:34px;height:34px}.sp{flex:1}
.view{display:none;flex:1;min-height:0;flex-direction:column}.view.on{display:flex}
.wrap{max-width:1100px;width:100%;margin:0 auto;padding:18px 16px 30px;overflow:auto}
.hero{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--ln);border-radius:22px;padding:24px;background:radial-gradient(700px 220px at 100% 0,var(--ac2),transparent 70%),var(--pn);box-shadow:0 10px 30px -18px var(--c1)}
.hero.drag{outline:3px dashed var(--ac)}
.hero h1{margin:0 0 6px;font-size:clamp(22px,4vw,30px);line-height:1.15;letter-spacing:-.02em}.hero p{margin:0;color:var(--mut);max-width:520px}
.acts{display:flex;gap:10px;flex-wrap:wrap}.big{padding:12px 22px;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip2{flex:none;border-radius:999px;padding:8px 16px;font-size:.88em;background:var(--pn);border:1.5px solid color-mix(in srgb,var(--cc,var(--ac)) 35%,var(--ln))}
.chip2.on,.chip2.on:hover:not(:disabled){background:var(--cc,var(--ac));color:#fff;border-color:transparent}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-weight:800}.sec::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--cc)}.sec::after{content:"";flex:1;height:1px;background:var(--ln)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tc{position:relative;flex-direction:column;justify-content:center;text-align:center;gap:10px;min-height:128px;padding:16px 8px;border-radius:18px;white-space:normal;background:color-mix(in srgb,var(--cc) 8%,var(--pn));border:1.5px solid color-mix(in srgb,var(--cc) 22%,transparent)}
.tc:hover:not(:disabled){transform:translateY(-4px);border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--pn));box-shadow:0 14px 26px -14px var(--cc)}
.ch{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,var(--cc),color-mix(in srgb,var(--cc) 58%,#000));color:#fff;box-shadow:0 8px 16px -8px var(--cc)}.ch .i{width:23px;height:23px;color:#fff}
.tc b{font-size:.86em;line-height:1.25}.tc small{display:none;color:var(--mut);font-weight:400;font-size:.76em}
.hq{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;padding:0;justify-content:center;font-size:13px;font-weight:800;color:var(--cc,var(--ac));background:var(--pn);border:1.6px solid color-mix(in srgb,var(--cc,var(--ac)) 50%,var(--ln))}
.mut{color:var(--mut)}
/* ruang kerja */
.stage{flex:1;min-height:0;overflow:auto;background:var(--bg2);background-image:repeating-conic-gradient(color-mix(in srgb,var(--mut) 10%,transparent) 0 25%,transparent 0 50%);background-size:20px 20px;display:flex;padding:12px;touch-action:pan-x pan-y}
.holder{position:relative;margin:auto;flex:none;box-shadow:0 12px 34px -14px rgba(0,0,0,.55)}
#view,#ov{display:block;width:100%;height:100%;background:repeating-conic-gradient(#d9d9e3 0 25%,#fff 0 50%) 0 0/16px 16px}
#ov{position:absolute;inset:0;background:none;pointer-events:none}
.stage.tool{touch-action:none}
.crp{position:absolute;border:2px solid #fff;outline:9999px solid rgba(0,0,0,.5);cursor:move;touch-action:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.crp::before{content:"";position:absolute;inset:0;background:linear-gradient(#fff6 1px,transparent 1px) 0 33.3%/100% 33.3%,linear-gradient(90deg,#fff6 1px,transparent 1px) 33.3% 0/33.3% 100%}
.crp i{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--ac);touch-action:none}.crp i::after{content:"";position:absolute;inset:-10px}
.crp .a{left:-11px;top:-11px}.crp .b{right:-11px;top:-11px}.crp .c{left:-11px;bottom:-11px}.crp .d{right:-11px;bottom:-11px}
.tov{position:absolute;transform:translate(-50%,-50%);white-space:pre;text-align:center;line-height:1.2;cursor:move;touch-action:none;padding:4px 8px;outline:2px dashed var(--ac);outline-offset:2px;user-select:none;-webkit-user-select:none}
.pn{flex:none;background:var(--pn);border-top:1px solid var(--ln);box-shadow:0 -8px 24px -16px rgba(0,0,0,.4);border-radius:18px 18px 0 0;max-height:36vh;display:flex;flex-direction:column}
.pnh{display:flex;align-items:center;gap:8px;padding:10px 14px 4px}.pnh b{font-size:15px}
.pnb{overflow:auto;padding:4px 16px 12px}.pn.min .pnb{display:none}.pn.min{max-height:none}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.r>*{flex:none}
.plab{font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 3px}
.rg{display:flex;align-items:center;gap:10px}.rg b{min-width:54px;text-align:right;font-size:13px}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:12px;background:var(--bg);border:1px solid var(--ln)}.seg button{border:0;box-shadow:none;background:none;padding:6px 12px;border-radius:9px}.seg button.on{background:var(--ac);color:var(--on)}
.tgl button.on{background:var(--ac);color:var(--on);border-color:transparent}
.csw{width:28px;height:28px;border-radius:50%;padding:0;border:3px solid var(--pn)!important;box-shadow:0 0 0 1px var(--ln)}.csw.on{box-shadow:0 0 0 2px var(--ink)}
.cp{padding:0}.cp input{width:34px;height:30px;padding:0;border:0;background:none}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.fl button{flex-direction:column;gap:4px;padding:5px 4px;font-size:11px;border-radius:12px;white-space:normal}.fl canvas{width:100%;height:auto;border-radius:8px;display:block}.fl button.on{background:var(--ac2);border-color:var(--ac);box-shadow:inset 0 0 0 1.5px var(--ac)}
.tools{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--pn);border-top:1px solid var(--ln);scrollbar-width:none}.tools::-webkit-scrollbar{display:none}
.tl{position:relative;flex:none;flex-direction:column;gap:5px;min-width:68px;padding:9px 6px 7px;border-radius:16px;font-size:11.5px;line-height:1.1;white-space:normal;text-align:center;background:color-mix(in srgb,var(--cc) 9%,var(--pn));border:1.5px solid color-mix(in srgb,var(--cc) 25%,transparent)}
.tl .ch{width:34px;height:34px;border-radius:11px}.tl .ch .i{width:19px;height:19px}
.tl.on,.tl.on:hover:not(:disabled){background:color-mix(in srgb,var(--cc) 28%,var(--pn));border-color:var(--cc);box-shadow:inset 0 0 0 1.5px var(--cc)}
.tl .hq{top:-6px;right:-5px;width:19px;height:19px;font-size:11px}
.note{background:var(--ac2);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.res{font-weight:700;color:var(--ac)}
dialog{background:var(--pn);color:var(--ink);border:1px solid var(--ln);border-radius:20px;padding:20px;width:min(440px,94vw);max-height:92vh;overflow:auto;box-shadow:0 24px 60px -12px rgba(0,0,0,.5)}dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}dialog h3{margin:0 0 8px}
.hsv{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--ln);border-radius:12px}
#hlS{margin:8px 0 10px 18px;padding:0;line-height:1.55}#hlS li{margin:3px 0}
.hltip{background:var(--ac2);border-radius:10px;padding:8px 12px;font-size:13px;margin:6px 0 12px}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50}.bx{background:var(--pn);border-radius:18px;padding:22px 26px;min-width:230px;text-align:center}
.spin{width:34px;height:34px;border:4px solid var(--ln);border-top-color:var(--ac);border-radius:50%;margin:0 auto 12px;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
progress{width:100%;height:8px;accent-color:var(--ac)}
[hidden]{display:none!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;display:none;z-index:60;max-width:90vw;box-shadow:0 10px 30px -8px rgba(0,0,0,.5)}
/* massal */
.bgrid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;align-content:start}
.bi{position:relative;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:6px;font-size:11px;text-align:center}.bi img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}.bi span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.bi button{position:absolute;top:2px;right:2px;padding:2px 7px;border-radius:50%}
.bset{background:var(--pn);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));max-height:46vh;overflow:auto}
@media (min-width:861px){#ws{flex-direction:row;flex-wrap:wrap}#ws>.stage{flex:1 1 60%;order:1}#ws>.pn{order:2;width:340px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--ln)}#ws>.tools{order:3;flex:1 0 100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== gaya tombol seragam: chip ikon bergradasi + latar berwarna di SEMUA tombol ===== */
button{background:color-mix(in srgb,var(--cc,var(--ac)) 11%,var(--pn));border:1.5px solid color-mix(in srgb,var(--cc,var(--ac)) 32%,transparent)}
button:hover:not(:disabled){background:color-mix(in srgb,var(--cc,var(--ac)) 22%,var(--pn));border-color:var(--cc,var(--ac));box-shadow:0 8px 16px -10px var(--cc,var(--ac))}
button>svg.i:first-child{box-sizing:content-box;width:16px;height:16px;padding:6px;margin:-4px 0 -4px -8px;border-radius:10px;background:linear-gradient(140deg,var(--cc,var(--ac)),color-mix(in srgb,var(--cc,var(--ac)) 58%,#000));color:#fff;box-shadow:0 5px 10px -5px var(--cc,var(--ac))}
button.p>svg.i:first-child{background:rgba(255,255,255,.24);box-shadow:none}
button.dng,#sReset{--cc:var(--bad)}
.ib>svg.i:first-child,.seg button>svg.i:first-child,.tgs button>svg.i:first-child,.nudge button>svg.i:first-child,.top button>svg.i:first-child,.brand>svg:first-child{box-sizing:content-box;width:18px;height:18px;padding:0;margin:0;border-radius:0;background:none;box-shadow:none;color:var(--cc,var(--ac))}
.top button.p>svg.i:first-child{color:#fff}
.ib{border-radius:999px}
:is(.r,.pact,.edrow,.acts,.bset .r,#bset)>button:not(.p):not(.dng):nth-child(5n+1){--cc:var(--c1)}
:is(.r,.pact,.edrow,.acts)>button:not(.p):not(.dng):nth-child(5n+2){--cc:var(--c2)}
:is(.r,.pact,.edrow,.acts)>button:not(.p):not(.dng):nth-child(5n+3){--cc:var(--c3)}
:is(.r,.pact,.edrow,.acts)>button:not(.p):not(.dng):nth-child(5n+4){--cc:var(--c4)}
:is(.r,.pact,.edrow,.acts)>button:not(.p):not(.dng):nth-child(5n+5){--cc:var(--c5)}
.tgs button:nth-child(5n+1){--cc:var(--c1)}.tgs button:nth-child(5n+2){--cc:var(--c2)}.tgs button:nth-child(5n+3){--cc:var(--c3)}.tgs button:nth-child(5n+4){--cc:var(--c4)}.tgs button:nth-child(5n+5){--cc:var(--c5)}
.tgs button.on{background:var(--cc,var(--ac));color:#fff;border-color:transparent}
.tgs button.on>svg.i:first-child{color:#fff}
.seg button.on{background:var(--cc,var(--ac))}
.chip2:nth-child(5n+1){--cc:var(--c1)}
@media (max-width:480px){.brand span{display:none}.top{gap:6px;padding:8px 10px}}

/* ===== bagian yang masih default: segmen, opsi centang, navigasi, favorit ===== */
.seg{background:none!important;border:0!important;padding:0!important;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid color-mix(in srgb,var(--cc,var(--ac)) 32%,transparent)!important;background:color-mix(in srgb,var(--cc,var(--ac)) 11%,var(--pn))!important;border-radius:12px;box-shadow:none;padding:7px 13px;color:var(--ink)}
.seg button:hover:not(:disabled){background:color-mix(in srgb,var(--cc,var(--ac)) 22%,var(--pn))!important;border-color:var(--cc,var(--ac))!important}
.seg button.on,.seg button.on:hover:not(:disabled){background:linear-gradient(140deg,var(--cc,var(--ac)),color-mix(in srgb,var(--cc,var(--ac)) 62%,#000))!important;color:#fff!important;border-color:transparent!important;box-shadow:0 6px 12px -6px var(--cc,var(--ac))}
.seg button:nth-child(5n+1){--cc:var(--c1)}.seg button:nth-child(5n+2){--cc:var(--c2)}.seg button:nth-child(5n+3){--cc:var(--c3)}.seg button:nth-child(5n+4){--cc:var(--c4)}.seg button:nth-child(5n+5){--cc:var(--c5)}
label.opt{--cc:var(--c3);display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:color-mix(in srgb,var(--cc) 8%,var(--pn));border:1.5px solid color-mix(in srgb,var(--cc) 28%,transparent);border-radius:14px;padding:10px 12px;margin:8px 0;transition:background .15s,border-color .15s,transform .12s}
label.opt:hover{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--pn))}
label.opt:active{transform:scale(.985)}
label.opt:has(input:checked){background:color-mix(in srgb,var(--cc) 22%,var(--pn));border-color:var(--cc);box-shadow:inset 0 0 0 1px var(--cc)}
label.opt input{accent-color:var(--cc);width:18px;height:18px;margin:2px 0 0;flex:none}
label.opt small{display:block;color:var(--mut);font-weight:400}
label.opt:nth-of-type(2n){--cc:var(--c2)}label.opt:nth-of-type(3n){--cc:var(--c4)}

/* ===== v4: paksa semua tombol, dropdown, dan kolom isian berwarna (terang + gelap) ===== */
:root{--tn:10%;--th:20%;--tb:38%;--to:7%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tn:19%;--th:32%;--tb:52%;--to:15%}}
:root[data-theme="dark"]{--tn:19%;--th:32%;--tb:52%;--to:15%}
button:not(.p):not(.on):not(.csw):not(.hq):not(.brand):not(.fv){background-color:color-mix(in srgb,var(--cc,var(--ac)) var(--tn),var(--pn))!important;border:1.5px solid color-mix(in srgb,var(--cc,var(--ac)) var(--tb),transparent)!important;color:var(--ink)}
button:not(.p):not(.on):not(.csw):not(.hq):not(.brand):not(.fv):hover:not(:disabled){background-color:color-mix(in srgb,var(--cc,var(--ac)) var(--th),var(--pn))!important;border-color:var(--cc,var(--ac))!important}
button.dng:not(.on){--cc:var(--bad)}
select,textarea,input[type=text],input[type=number],input[type=search]{background-color:color-mix(in srgb,var(--ac) var(--to),var(--pn))!important;border:1.5px solid color-mix(in srgb,var(--ac) var(--tb),transparent)!important;color:var(--ink)}
select:focus,textarea:focus,input[type=text]:focus,input[type=number]:focus{border-color:var(--ac)!important}
.srch input{background:none!important;border:0!important}
label.opt{background:color-mix(in srgb,var(--cc) var(--to),var(--pn))!important;border-color:color-mix(in srgb,var(--cc) var(--tb),transparent)!important}
label.opt:has(input:checked){background:color-mix(in srgb,var(--cc) var(--th),var(--pn))!important;border-color:var(--cc)!important}
.chip2:not(.on){background-color:color-mix(in srgb,var(--cc,var(--ac)) var(--tn),var(--pn))!important}
button.on:not(.p):not(.seg button):not(.csw):not(.fbtn):not(#bnav button){background:linear-gradient(140deg,var(--cc,var(--ac)),color-mix(in srgb,var(--cc,var(--ac)) 62%,#000))!important;color:#fff!important;border-color:transparent!important}
button.on:not(.p):not(.csw):not(#bnav button)>svg.i:first-child{background:rgba(255,255,255,.22);box-shadow:none}
.fbtn.on{background-color:color-mix(in srgb,var(--ac) var(--th),var(--pn))!important;border-color:var(--ac)!important}
.csw{border:3px solid var(--pn)!important}

.tl.on{background:color-mix(in srgb,var(--cc) var(--th),var(--pn))!important;color:var(--ink)!important}

/* jendela mengambang */
.grip{display:none;width:46px;height:6px;border-radius:3px;background:var(--mut);opacity:.55;margin:8px auto 0;cursor:grab;touch-action:none;position:relative}.grip::after{content:"";position:absolute;inset:-10px -30px}
@media (max-width:860px){
 .grip{display:block}
 #pn{position:fixed!important;width:min(330px,calc(100vw - 16px));max-height:min(46vh,380px)!important;border:1.5px solid color-mix(in srgb,var(--ac) 55%,var(--ln));border-radius:18px!important;box-shadow:0 18px 46px -8px rgba(0,0,0,.65);z-index:30}

 if(s.m==='pen'||s.m==='mk'){g.beginPath();g.moveTo(A[0],A[1]);for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1]/1)/2;g.quadraticCurveTo(p[i][0],p[i][1],mx,(p[i][1]+p[i+1][1])/2)}g.lineTo(B[0],B[1]);if(p.length===1)g.lineTo(A[0]+.01,A[1]);g.stroke()}
 else if(s.m==='line'||s.m==='arr'){g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.stroke();if(s.m==='arr'){const an=Math.atan2(B[1]-A[1],B[0]-A[0]),L=s.w*k*4;g.beginPath();g.moveTo(B[0],B[1]);g.lineTo(B[0]-L*Math.cos(an-.5),B[1]-L*Math.sin(an-.5));g.moveTo(B[0],B[1]);g.lineTo(B[0]-L*Math.cos(an+.5),B[1]-L*Math.sin(an+.5));g.stroke()}}
 else if(s.m==='rect'){s.fill?g.fillRect(A[0],A[1],B[0]-A[0],B[1]-A[1]):g.strokeRect(A[0],A[1],B[0]-A[0],B[1]-A[1])}
 else if(s.m==='ell'){g.beginPath();g.ellipse((A[0]+B[0])/2,(A[1]+B[1])/2,Math.abs(B[0]-A[0])/2,Math.abs(B[1]-A[1])/2,0,0,7);s.fill?g.fill():g.stroke()}g.restore()}

 else{if(!p.img)return c;const w=p.ls/100*W,h=w*p.img.height/p.img.width;iw=w;ih=h;item=(x,y)=>g.drawImage(p.img,x-w/2,y-h/2,w,h)}

 else{const m=Math.min(W,H)*.04,pos={c:[W/2,H/2],br:[W-iw/2-m,H-ih/2-m],bl:[iw/2+m,H-ih/2-m],tr:[W-iw/2-m,ih/2+m],tl:[iw/2+m,ih/2+m]}[p.pos];g.save();g.translate(pos[0],pos[1]);if(p.pos==='c')g.rotate(rot);item(0,0);g.restore()}

function stkBuild(src,p,maxd){const kk=Math.min(1,(maxd||2400)/Math.max(src.width,src.height));if(kk<1)src=resizeCanvas(src,src.width*kk,src.height*kk,0);const cut=bgMask(src,sampleEdge(src),p.tol,false),W=cut.width,H=cut.height,r=p.b/100*Math.max(W,H),pad=Math.ceil(r*1.6)+2,out=mk(W+2*pad,H+2*pad),g=out.getContext('2d');
 if(r>0.5){const t=clone(cut),tg=t.getContext('2d');tg.globalCompositeOperation='source-in';tg.fillStyle=p.c;tg.fillRect(0,0,W,H);if(p.sh){g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=r*.7;g.shadowOffsetY=r*.35}for(const ring of [1,.5]){const n=ring===1?24:12;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;g.drawImage(t,pad+Math.cos(a)*r*ring,pad+Math.sin(a)*r*ring)}}g.shadowColor='transparent';g.shadowBlur=0;g.shadowOffsetY=0}

function trimAlpha(c){const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}if(x1<x0)return c;const o=mk(x1-x0+1,y1-y0+1);o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o}

function colBuild(W){const L=CO.files;if(!L.length)return null;const gap=CO.gap/100*W,n=L.length;let c,g;const rr=CO.r/100*W;
 const rc=(g,x,y,w,h)=>{g.save();g.beginPath();g.roundRect?g.roundRect(x,y,w,h,rr):g.rect(x,y,w,h);g.clip()};
 if(CO.lay==='grid'){const cols=Math.min(CO.cols,n),rows=Math.ceil(n/cols),cw=(W-(cols+1)*gap)/cols,ch=cw/CO.asp;c=mk(W,rows*ch+(rows+1)*gap);g=c.getContext('2d');g.fillStyle=CO.bg;g.fillRect(0,0,c.width,c.height);
