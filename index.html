<style>
:root{--bg:#070b14;--bg2:#0d1424;--card:rgba(24,34,54,.62);--card2:rgba(15,23,42,.72);--line:rgba(148,163,184,.17);--ink:#f1f5f9;--mut:#94a3b8;--ac:#38bdf8;--on:#06111f;--ok:#34d399;--bad:#f87171;--code:#0a101d;--codeink:#cbd5e1;--shadow:0 30px 60px -24px rgba(0,0,0,.7);color-scheme:dark}
:root[data-theme="light"]{--bg:#f3f6fb;--bg2:#e6ecf6;--card:rgba(255,255,255,.78);--card2:rgba(255,255,255,.9);--line:rgba(15,23,42,.12);--ink:#0f172a;--mut:#5b6b82;--ac:#0284c7;--on:#fff;--ok:#059669;--bad:#dc2626;--code:#fbfcff;--codeink:#1e293b;--shadow:0 24px 48px -24px rgba(30,41,59,.35);color-scheme:light}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{--bg:#f3f6fb;--bg2:#e6ecf6;--card:rgba(255,255,255,.78);--card2:rgba(255,255,255,.9);--line:rgba(15,23,42,.12);--ink:#0f172a;--mut:#5b6b82;--ac:#0284c7;--on:#fff;--ok:#059669;--bad:#dc2626;--code:#fbfcff;--codeink:#1e293b;--shadow:0 24px 48px -24px rgba(30,41,59,.35);color-scheme:light}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
.mesh{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 15% -10%,color-mix(in srgb,#2563eb 34%,transparent),transparent 60%),radial-gradient(700px 480px at 95% 5%,color-mix(in srgb,#db2777 22%,transparent),transparent 60%),radial-gradient(800px 500px at 50% 110%,color-mix(in srgb,#14b8a6 22%,transparent),transparent 60%),var(--bg)}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,a.btn{font:inherit;color:inherit;cursor:pointer;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
/* tombol seragam */
.btn{--c:var(--ac);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:13px;font-size:.84rem;font-weight:700;border:1.5px solid color-mix(in srgb,var(--c) 38%,transparent);background:color-mix(in srgb,var(--c) 14%,var(--card2));color:var(--ink);white-space:nowrap;transition:transform .14s,box-shadow .18s,background .18s,border-color .18s}
.btn:hover{transform:translateY(-2px);border-color:var(--c);background:color-mix(in srgb,var(--c) 26%,var(--card2));box-shadow:0 12px 22px -14px var(--c)}
.btn:active{transform:scale(.95);box-shadow:none}
.btn .chip{display:grid;place-items:center;width:26px;height:26px;margin-left:-6px;border-radius:9px;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff;box-shadow:0 5px 10px -5px var(--c)}
.btn .chip svg{width:15px;height:15px}
.btn.primary{background:linear-gradient(135deg,var(--c1,var(--ac)),var(--c2,var(--ac)));color:#fff;border-color:transparent;box-shadow:0 12px 24px -12px var(--c1,var(--ac)),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.primary .chip{background:rgba(255,255,255,.24);box-shadow:none}
.btn.primary:hover{filter:brightness(1.08);background:linear-gradient(135deg,var(--c1,var(--ac)),var(--c2,var(--ac)))}
.btn.icon{padding:0;width:40px;height:40px;border-radius:12px}.btn.icon svg{width:18px;height:18px}
.btn.danger{--c:var(--bad)}.btn.ok{--c:var(--ok)}.btn.violet{--c:#a78bfa}.btn.amber{--c:#fbbf24}.btn.pink{--c:#f472b6}
.btn.on{background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 58%,#000));color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px var(--c)}
.btn:disabled{opacity:.45;pointer-events:none}
/* bilah atas */
.bar{max-width:1040px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0;display:flex;align-items:center;gap:10px}
.bar .sp{flex:1}
.seg{display:inline-flex;gap:5px;padding:4px;border-radius:14px;background:var(--card2);border:1px solid var(--line);backdrop-filter:blur(14px)}
.seg .btn{padding:6px 12px;border-radius:10px;font-size:.74rem;letter-spacing:.05em;border-color:transparent;background:transparent;box-shadow:none}
.seg .btn:hover{transform:none;box-shadow:none;background:color-mix(in srgb,var(--c) 18%,transparent)}
.seg .btn.on,.seg .btn.on:hover{border-color:transparent;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 58%,#000));color:#fff;box-shadow:0 8px 16px -8px var(--c)}
/* profil */
.wrap{max-width:1040px;margin:0 auto;padding:18px 18px 60px}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 20px 26px;border-radius:30px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.profile::before{content:"";position:absolute;inset:-40% -10% auto -10%;height:70%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 30%,transparent),transparent);opacity:.5;pointer-events:none}
.avatar{position:relative;width:112px;height:112px;margin-bottom:16px}
.avatar::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,#38bdf8,#a78bfa,#f472b6,#fbbf24,#34d399,#38bdf8);animation:spin 8s linear infinite;filter:blur(.3px)}
.avatar img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#1e293b;border:4px solid var(--bg2);display:block}
.avatar .dot{position:absolute;right:6px;bottom:6px;width:20px;height:20px;border-radius:50%;background:var(--ok);border:3px solid var(--bg2);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(1.4rem,4.2vw,2rem);font-weight:800;letter-spacing:-.03em;line-height:1.2;position:relative}
.bio{color:var(--mut);max-width:560px;margin:10px auto 18px;font-size:.96rem;position:relative}
.stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;position:relative}
.stat{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:.78rem;font-weight:700;color:var(--mut)}
.stat svg{color:var(--ac)}
/* daftar alat */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:30px 2px 14px}
.head h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:800;flex:1;min-width:150px;display:flex;align-items:center;gap:10px}
.head h2::before{content:"";width:6px;height:18px;border-radius:3px;background:linear-gradient(var(--ac),#a78bfa)}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{width:100%;padding:10px 14px 10px 40px;border-radius:13px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-size:.88rem}
.search input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;width:100%}.chips::-webkit-scrollbar{display:none}
.chips .btn{padding:7px 15px;border-radius:999px;flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:18px}
.card{--c1:#38bdf8;--c2:#a78bfa;position:relative;display:flex;flex-direction:column;gap:16px;padding:22px;border-radius:26px;background:var(--card);border:1.5px solid var(--line);backdrop-filter:blur(16px);box-shadow:var(--shadow);overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;animation:rise .5s both}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.card::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c1) 26%,transparent),transparent);pointer-events:none}
.card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--c1) 55%,transparent);box-shadow:0 36px 60px -26px color-mix(in srgb,var(--c1) 60%,#000)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.ctop{display:flex;gap:16px;align-items:flex-start;position:relative}
.ico{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 14px 26px -12px var(--c1)}
.ico svg{width:28px;height:28px}
.card h3{font-size:1.18rem;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.card p{color:var(--mut);font-size:.88rem;margin-top:4px}
.feats{display:flex;flex-wrap:wrap;gap:7px;list-style:none;position:relative}
.feats li{font-size:.74rem;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c1) 34%,transparent);background:color-mix(in srgb,var(--c1) 12%,transparent)}
.acts{display:flex;flex-wrap:wrap;gap:9px;position:relative}
.acts .btn{flex:0 0 auto}
.acts .grow{flex:1 1 130px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--mut);font-weight:600;position:relative}
.meta span{display:inline-flex;align-items:center;gap:5px}
.empty{text-align:center;color:var(--mut);padding:40px 10px;display:none}
.foot{max-width:1040px;margin:0 auto;padding:0 18px calc(72px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mut);font-size:.78rem}
/* penampil */
.ov{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:var(--bg)}
.ov.on{display:flex;animation:fade .2s both;background:var(--bg2)}
.ov:fullscreen{padding-bottom:0}
.ov.on .frame{border-radius:0}
@keyframes fade{from{opacity:0}}
.vbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:color-mix(in srgb,var(--bg2) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);flex-wrap:wrap}
.vt{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 180px}
.vt .ico{width:36px;height:36px;border-radius:11px}.vt .ico svg{width:19px;height:19px}
.vt b{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.vt small{color:var(--mut);font-size:.72rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt{order:1}.vact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;order:2}#bClose{order:3}
.vbody{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.frame{flex:1;width:100%;border:0;background:#fff}
.vload{position:absolute;inset:0;display:none;place-items:center;background:var(--bg);z-index:2}
.vload.on{display:grid}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ac);animation:spin .8s linear infinite;margin:0 auto 12px}
.vload p{color:var(--mut);font-size:.88rem;text-align:center}
.code{display:none;flex:1;min-height:0;flex-direction:column;background:var(--code)}
.code.on{display:flex}
.ctools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--line)}
.ctools .search{flex:1 1 200px;max-width:380px}.ctools .search input{padding:8px 12px 8px 38px;font-size:.84rem}
.ctools .cnt{font-size:.76rem;color:var(--mut);font-weight:700;min-width:54px;text-align:center}
.ctools .btn{padding:7px 12px;font-size:.78rem}.ctools .btn.icon{width:34px;height:34px}
.cview{flex:1;min-height:0;overflow:auto;padding:10px 0 40px;font-family:"JetBrains Mono",Consolas,"Fira Code",monospace;font-size:var(--fs,13px);line-height:1.65;color:var(--codeink);tab-size:2;-webkit-overflow-scrolling:touch}
.ln{display:flex;min-width:max-content}
.cview.wr .ln{min-width:0}
.ln i{flex:none;width:58px;padding-right:14px;text-align:right;color:var(--mut);opacity:.6;font-style:normal;user-select:none;-webkit-user-select:none;position:sticky;left:0;background:var(--code)}
.ln code{white-space:pre;padding-right:20px;font:inherit}
.cview.wr .ln code{white-space:pre-wrap;word-break:break-all}
.ln.hit{background:color-mix(in srgb,#fbbf24 20%,transparent)}.ln.hit i{background:color-mix(in srgb,#fbbf24 28%,var(--code));opacity:1}
.ln mark{background:#fbbf24;color:#111;border-radius:3px;padding:0 1px}
.ln .t{color:#38bdf8}.ln .s{color:#a3e635}.ln .c{color:#64748b;font-style:italic}
:root[data-theme="light"] .ln .t{color:#0369a1}:root[data-theme="light"] .ln .s{color:#4d7c0f}
@media (prefers-color-scheme:light){:root[data-theme="auto"] .ln .t{color:#0369a1}:root[data-theme="auto"] .ln .s{color:#4d7c0f}}
.more{margin:2px 0 2px 8px;padding:1px 9px;border-radius:7px;border:1px solid var(--line);background:var(--card2);color:var(--ac);font:inherit;font-size:.76em;cursor:pointer}
.loadmore{display:block;margin:14px auto}
.cmsg{padding:30px 20px;text-align:center;color:var(--mut)}
.diagbox{position:absolute;inset:0;display:none;overflow:auto;background:var(--bg);z-index:3;padding:20px 16px 40px}.diagbox.on{display:block}
.diag{max-width:640px;margin:20px auto;padding:24px;border-radius:24px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--bad) 45%,var(--line));box-shadow:var(--shadow)}
.cview .diag{margin:30px auto}
.dico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;font-weight:800;color:#fff;background:linear-gradient(140deg,#fb923c,var(--bad));margin-bottom:14px;box-shadow:0 12px 24px -10px var(--bad)}
.diag h3{font-size:1.15rem;font-weight:800;margin-bottom:6px}.diag p{color:var(--mut);font-size:.9rem;margin-bottom:12px}
.diag ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.diag li{font-size:.8rem;padding:8px 11px;border-radius:11px;background:var(--card2);border:1px solid var(--line);word-break:break-all}.diag code{font-family:"JetBrains Mono",monospace}
.okc{color:var(--ok)}.badc{color:var(--bad)}
.diag details{margin-bottom:14px;font-size:.82rem;color:var(--mut)}.diag summary{cursor:pointer;font-weight:700;margin-bottom:6px}.diag pre{white-space:pre-wrap;word-break:break-all;background:var(--code);color:var(--codeink);padding:10px;border-radius:10px;font-size:.74rem;max-height:200px;overflow:auto}
.dact{display:flex;flex-wrap:wrap;gap:9px}
.cwarn{margin:0 14px 10px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,#fbbf24 18%,transparent);border:1px solid color-mix(in srgb,#fbbf24 50%,transparent);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:.82rem;white-space:normal;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:.85rem;z-index:300;transition:.25s;box-shadow:0 14px 30px -8px rgba(0,0,0,.5);max-width:92vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px),(pointer:coarse) and (max-width:1100px){
 .vact .lbl,#bClose .lbl{display:none}.vact .btn,#bClose{padding:0;width:42px;height:42px;border-radius:12px}.vact .btn .chip,#bClose .chip{margin:0;background:none;box-shadow:none;color:inherit;width:auto;height:auto}
 .vact .seg .btn{width:auto;padding:0 12px}.vact .seg .lbl{display:inline}
 .vt{order:1;flex:1 1 0}#bClose{order:2}.vact{order:3;flex:1 1 100%;justify-content:space-between}
 .vbar{gap:8px}
 .acts .btn{flex:1 1 calc(50% - 6px)}.acts .btn.icon{flex:0 0 40px}
 .card{padding:18px}
}
@media (max-width:480px){.vact .seg .lbl{display:none}.vact .seg .btn{width:44px;padding:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cards{align-items:stretch}.card .acts{margin-top:auto}.cards .card:last-child:nth-child(odd){grid-column:1/-1}
.cards .card:last-child:nth-child(odd) .acts .grow{flex:0 1 280px}
@media (max-width:760px){.cards .card:last-child:nth-child(odd){grid-column:auto}.cards .card:last-child:nth-child(odd) .acts .grow{flex:1 1 130px}}
.bot{margin:18px 0 6px;border-radius:28px;background:var(--card);border:1.5px solid var(--line);backdrop-filter:blur(16px);overflow:hidden}
.bot-hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:22px;background:linear-gradient(120deg,color-mix(in srgb,#25d366 26%,transparent),color-mix(in srgb,#38bdf8 14%,transparent) 60%,transparent)}
.bot-av{position:relative;width:70px;height:70px;flex:none}
.bot-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #25d366;box-shadow:0 12px 26px -12px #25d366}
.bot-av i{position:absolute;right:1px;bottom:3px;width:17px;height:17px;border-radius:50%;border:3px solid var(--bg2);background:var(--bad)}
.bot-av.ok i{background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 25%,transparent)}}
.bot-t{flex:1;min-width:190px}.bot-t h2{font-size:1.25rem;font-weight:800}.bot-t p{font-size:.84rem;color:var(--mut)}
.bot-by{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:.74rem;font-weight:700;color:var(--mut)}.bot-by img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.bot-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:.78rem;font-weight:800}
.bot-pill i{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.bot-pill.ok i{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}.bot-pill.wait i{background:#fbbf24}
.bot-in{padding:18px 22px 22px;display:flex;flex-direction:column;gap:16px}
.bot-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.bt{padding:12px 8px;border-radius:16px;background:var(--card2);border:1px solid var(--line);text-align:center}.bt em{font-style:normal;font-size:1.1rem}.bt b{display:block;font-size:1.05rem;font-weight:800;overflow-wrap:anywhere}.bt small{color:var(--mut);font-size:.7rem;font-weight:700}
.bot-steps{display:flex;gap:6px;list-style:none}
.bot-steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.7rem;font-weight:700;color:var(--mut);text-align:center}
.bot-steps .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--card2);border:1.5px solid var(--line);font-size:.78rem}
.bot-steps .done .n{background:var(--ok);border-color:var(--ok);color:#052e1b}.bot-steps .cur{color:var(--ink)}.bot-steps .cur .n{background:var(--ac);border-color:var(--ac);color:var(--on);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 25%,transparent)}
.bot-grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
.bot-main{display:flex;flex-direction:column;gap:12px}
.bot-box{padding:16px;border-radius:18px;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.bot-box h3{font-size:.9rem;font-weight:800}.bot-box p,.bot-hint{font-size:.82rem;color:var(--mut)}.bot-hint.warn{color:#fbbf24}
.bot-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.bot-f{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}.bot-f span{font-size:.76rem;font-weight:700;color:var(--mut)}
.bot input[type=url],.bot input[type=password],.bot input[type=text],.bot input[type=tel]{width:100%;padding:11px 13px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem}
.bot input:focus{outline:0;border-color:var(--ac)}
.bot-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bot-qr{align-self:center;width:min(240px,100%);border-radius:16px;background:#fff;padding:8px}
.bot-code{align-self:center;font:800 1.9rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;padding:14px 18px;border-radius:14px;background:var(--code);color:var(--codeink);border:1px dashed var(--line)}
.bot-pre{position:relative;padding:12px 78px 12px 14px;border-radius:14px;background:var(--code);color:var(--codeink);border:1px solid var(--line);font:600 .78rem/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow-x:auto}
.bot-pre .btn{position:absolute;top:7px;right:7px;padding:4px 10px;font-size:.72rem;border-radius:10px}
.bot-phone{border-radius:26px;background:#0b141a;border:6px solid #1f2933;overflow:hidden;color:#e9edef;font-size:.8rem;box-shadow:var(--shadow)}
.ph-h{display:flex;gap:9px;align-items:center;padding:10px 12px;background:#202c33}.ph-h img{width:32px;height:32px;border-radius:50%}.ph-h b{display:block;font-size:.84rem}.ph-h small{color:#25d366;font-size:.7rem}.ph-h small.off{color:#8696a0}
.ph-b{padding:12px;height:270px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background:radial-gradient(circle at 20% 10%,#14232b,#0b141a 70%)}
.bb{max-width:90%;padding:7px 10px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .3s both}.bb.me{align-self:flex-end;background:#005c4b;border-top-right-radius:2px}.bb.bot{align-self:flex-start;background:#202c33;border-top-left-radius:2px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
.ph-c{display:flex;gap:6px;flex-wrap:wrap;padding:9px 10px;background:#111b21}.ph-c button{border:0;border-radius:999px;padding:4px 11px;background:#202c33;color:#aebac1;font:700 .72rem ui-monospace,Menlo,Consolas,monospace}.ph-c button.on{background:#25d366;color:#052e1b}
.creator{display:inline-flex;align-items:center;gap:7px;margin:6px 0 0;padding:5px 13px;border-radius:999px;font-size:.78rem;font-weight:800;color:#422006;background:linear-gradient(135deg,#fde68a,#f59e0b);box-shadow:0 8px 20px -10px #f59e0b}
.bot-cmds summary{cursor:pointer;font-weight:800;font-size:.88rem;padding:4px 0}
.bot-cmds .search{margin:10px 0}
.bot-cat{margin:12px 0 6px;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.bot-cmd{display:flex;gap:10px;align-items:baseline;width:100%;padding:8px 10px;border-radius:12px;background:none;border:1px solid transparent;text-align:left}
.bot-cmd:hover,.bot-cmd:focus-visible{background:var(--card2);border-color:var(--line)}
.bot-cmd code{font:700 .82rem ui-monospace,Menlo,Consolas,monospace;color:var(--ac)}.bot-cmd span{font-size:.82rem;color:var(--mut)}
#botApiBody{display:flex;flex-direction:column;gap:10px;margin-top:10px}
@media(max-width:760px){.bot-grid{grid-template-columns:1fr}.bot-phone{max-width:340px;width:100%;justify-self:center}}
@media(max-width:560px){.bot-hero,.bot-in{padding-inline:16px}.bot-cmd{flex-direction:column;gap:2px}}

/* ---------- daftar kartu ---------- */
function renderChips(){const tags=[['all',t('all')]].concat([...new Set(TOOLS.map(x=>x.tag))].map(g=>[g,t(g)]));$('#chips').innerHTML=tags.map(([k,l])=>'<button class="btn'+(filter===k?' on':'')+'" data-f="'+k+'">'+esc(l)+'</button>').join('')}
$('#chips').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;renderChips();renderCards()}};
$('#q').oninput=()=>renderCards();
function renderCards(){const q=$('#q').value.trim().toLowerCase();
 const L=TOOLS.filter(x=>(filter==='all'||x.tag===filter)&&(!q||(x.title+' '+x.desc[lang]+' '+x.feats[lang].join(' ')).toLowerCase().includes(q)));
 $('#empty').style.display=L.length?'none':'block';
 $('#cards').innerHTML=L.map((x,i)=>'<article class="card" style="--c1:'+x.c1+';--c2:'+x.c2+';animation-delay:'+i*70+'ms"><div class="ctop"><span class="ico">'+ico(x.icon)+'</span><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.desc[lang])+'</p></div></div>'
  +'<ul class="feats">'+x.feats[lang].map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>'
  +'<div class="acts"><button class="btn primary grow" data-a="open" data-id="'+x.id+'"><span class="chip">'+ico('eye')+'</span>'+t('open')+'</button><button class="btn violet" data-a="code" data-id="'+x.id+'"><span class="chip">'+ico('code')+'</span>'+t('code')+'</button><button class="btn ok" data-a="dl" data-id="'+x.id+'"><span class="chip">'+ico('down')+'</span>'+t('download')+'</button><a class="btn icon pink" href="'+x.file+'" target="_blank" rel="noopener" aria-label="'+t('newTab')+'" title="'+t('newTab')+'">'+ico('ext')+'</a></div>'
  +'<div class="meta"><span>'+ico('file')+'<span data-size="'+x.id+'">'+sizeLabel(x.id)+'</span></span><span>'+ico('shield')+t('stat2')+'</span></div></article>').join('');loadSizes()}
$('#cards').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const x=TOOLS.find(y=>y.id===b.dataset.id);if(b.dataset.a==='open')openApp(x,'app');else if(b.dataset.a==='code')openApp(x,'code');else if(b.dataset.a==='dl')downloadSrc(x)};
const SIZES={};const fmtB=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function sizeLabel(id){const z=SIZES[id];if(!z)return '…';return fmtB(z.real||z.n)}
function paintSizes(){$$('[data-size]').forEach(e=>{e.textContent=sizeLabel(e.dataset.size)})}
function loadSizes(){TOOLS.forEach(x=>{if(SIZES[x.id])return;fetch(x.file,{method:'HEAD'}).then(r=>{const n=+r.headers.get('content-length');if(n&&!r.headers.get('content-encoding')){SIZES[x.id]={n};paintSizes()}}).catch(()=>{})})}

/* ---------- penampil: cek berkas dulu, baru tampilkan ---------- */
const frame=$('#frame');let loadT=0,tok=0,pushed=false;
/* navigasi iframe tanpa menambah riwayat browser (agar tombol Back/Maju tetap benar) */
function navFrame(url){try{frame.contentWindow.location.replace(url)}catch(e){frame.src=url}}
function frameHref(){try{return frame.contentWindow.location.href}catch(e){return ''}}const PROBE={};
function setLoad(on,txt){$('#vload').classList.toggle('on',on);if(txt)$('#vloadTxt').textContent=txt}
const looksHtml=s=>/<!doctype html|<html|<head|<body/i.test(s.slice(0,4000));
/* mencoba beberapa kemungkinan path, memilih berkas HTML terbesar yang valid */
async function probe(x,force){const old=PROBE[x.id];if(old&&!force&&(old.local||old.text||old.problem))return old;
 const base=x.file.split('/').pop(),cands=[...new Set([x.file,'tools/'+base,base,'../tools/'+base,'file/tools/'+base])],tried=[],ok=[],bad=[];
 for(const u of cands){try{const r=await fetch(u+(force?(u.includes('?')?'&':'?')+'v='+Date.now():''),{cache:'no-store'});let text='';if(r.ok)text=await r.text();tried.push({u,status:r.status,bytes:text.length});if(r.ok&&looksHtml(text)){ok.push({u,text});if(text.length>=x.min)break}else if(r.ok&&text)bad.push({u,text})}catch(e){tried.push({u,status:0,bytes:0})}}
 const res={tried,url:null,text:null,bytes:0,problem:null};
 if(ok.length){ok.sort((p,q)=>q.text.length-p.text.length);const w=ok[0];res.url=w.u;res.text=w.text;res.bytes=new Blob([w.text]).size;if(/^version https:\/\/git-lfs/.test(w.text))res.problem='lfs';else if(w.text.length<x.min)res.problem='small'}
 else if(bad.length){bad.sort((p,q)=>q.text.length-p.text.length);const w=bad[0];res.url=w.u;res.text=w.text;res.bytes=new Blob([w.text]).size;res.problem=/^version https:\/\/git-lfs/.test(w.text)?'lfs':'invalid'}
 else res.problem=tried.every(a=>a.status===0)?'network':'notfound';
 PROBE[x.id]=res;if(res.bytes){SIZES[x.id]=Object.assign(SIZES[x.id]||{n:res.bytes},{real:res.bytes});paintSizes()}return res}
function diagMsg(x,r){return({notfound:t('dNotFound'),network:t('dNet'),invalid:t('dInvalid').replace('{f}',x.file).replace('{n}',fmtB(r.bytes||0)),small:t('dSmall').replace('{n}',fmtB(r.bytes||0)).replace('{m}',fmtB(x.min)),lfs:t('dLfs')})[r.problem]||''}
function diagHtml(x,r){const rows=r.tried.map(a=>'<li><code>'+esc(a.u)+'</code> <b class="'+(a.status===200?'okc':'badc')+'">'+(a.status||'error')+'</b>'+(a.bytes?' · '+fmtB(a.bytes):'')+'</li>').join('');
 return '<div class="diag"><div class="dico">!</div><h3>'+esc(t('dTitle'))+'</h3><p>'+esc(diagMsg(x,r))+'</p><ul>'+rows+'</ul>'+(r.text?'<details><summary>'+esc(t('dPreview'))+'</summary><pre>'+esc(r.text.slice(0,700))+'</pre></details>':'')
  +'<div class="dact"><button class="btn amber" data-d="retry"><span class="chip">'+ico('refresh')+'</span>'+esc(t('retry'))+'</button>'+(r.text&&r.problem!=='invalid'&&r.problem!=='lfs'?'<button class="btn violet" data-d="force"><span class="chip">'+ico('eye')+'</span>'+esc(t('force'))+'</button>':'')+'<button class="btn pink" data-d="tab"><span class="chip">'+ico('ext')+'</span>'+esc(t('newTab'))+'</button><button class="btn ok" data-d="pick"><span class="chip">'+ico('file')+'</span>'+esc(t('pick'))+'</button></div></div>'}
function openApp(x,mode,noPush){cur=x;SRC=null;tok++;$('#vTitle').textContent=x.title;$('#vSub').textContent=x.file;$('#vIco').style.cssText='--c1:'+x.c1+';--c2:'+x.c2;$('#vIco').className='ico';$('#vIco').innerHTML=ico(x.icon);
 document.body.classList.add('lock');$('#ov').classList.add('on');frame.dataset.id='';
 pushed=false;if(!noPush)try{history.pushState({app:x.id},'','#'+x.id);pushed=true}catch(e){}
 setMode(mode);setTimeout(()=>$('#bClose').focus(),50)}
const inApp=()=>$('#mApp').classList.contains('on');
function setMode(mode,force){const app=mode==='app';$('#mApp').classList.toggle('on',app);$('#mCode').classList.toggle('on',!app);$('#code').classList.toggle('on',!app);$('#bDl').style.display=app?'none':'';$('#bReload').style.display=app?'':'none';$('#diag').classList.remove('on');
 if(app){$('#frame').style.display='block';startApp(cur,!!force)}else{$('#frame').style.display='none';showCode(cur,!!force)}}
async function startApp(x,force){const my=++tok;$('#diag').classList.remove('on');
 if(!force&&frame.dataset.id===x.id){setLoad(false);return}
 setLoad(true,t('loadingApp'));const r=await probe(x,force);if(my!==tok||cur!==x)return;if(r.url&&!r.local)$('#vSub').textContent=r.url;
 if(r.problem&&r.problem!=='network'&&!r.force){setLoad(false);$('#frame').style.display='none';$('#diag').innerHTML=diagHtml(x,r);$('#diag').classList.add('on');return}
 $('#frame').style.display='block';frame.dataset.id=x.id;let blobTried=false;
 frame.onload=()=>{clearTimeout(loadT);setLoad(false);if(frameHref()==='about:blank')return;try{const d=frame.contentDocument;if(d&&d.body&&d.body.children.length===0&&r.text&&r.text.length>3000&&!blobTried){blobTried=true;navFrame(URL.createObjectURL(new Blob([r.text],{type:'text/html'})))}}catch(e){}};
 clearTimeout(loadT);loadT=setTimeout(()=>setLoad(false),9000);
 navFrame(r.local?r.url:((r.url||x.file)+(force?((r.url||x.file).includes('?')?'&':'?')+'v='+Date.now():'')))}
$('#mApp').onclick=()=>setMode('app');$('#mCode').onclick=()=>setMode('code');
function closeApp(fromPop){tok++;document.body.classList.remove('lock');$('#ov').classList.remove('on');frame.onload=null;navFrame('about:blank');frame.dataset.id='';cur=null;SRC=null;$('#diag').classList.remove('on');if(document.fullscreenElement)document.exitFullscreen&&document.exitFullscreen();if(fromPop)pushed=false;else if(pushed){pushed=false;try{history.back()}catch(e){}}else if(location.hash){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}}
$('#bClose').onclick=()=>closeApp(false);
addEventListener('popstate',()=>{if($('#ov').classList.contains('on')&&!location.hash)closeApp(true);else routeHash()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').classList.contains('on')&&!document.fullscreenElement)closeApp(false)});
function routeHash(){const id=location.hash.slice(1),x=TOOLS.find(y=>y.id===id);if(x&&!$('#ov').classList.contains('on'))openApp(x,'app',true)}
$('#bReload').onclick=()=>{frame.dataset.id='';delete PROBE[cur.id];startApp(cur,true)};
$('#bTab').onclick=()=>{const r=cur&&PROBE[cur.id];window.open((r&&r.url&&!r.local?r.url:cur.file),'_blank','noopener')};
$('#bFull').onclick=()=>{const o=$('#ov');if(document.fullscreenElement)document.exitFullscreen();else if(o.requestFullscreen)o.requestFullscreen().catch(()=>toast('Fullscreen tidak didukung'));else toast('Fullscreen tidak didukung')};
$('#bDl').onclick=()=>downloadSrc(cur);
document.addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b||!cur)return;const d=b.dataset.d;
 if(d==='retry'){delete PROBE[cur.id];frame.dataset.id='';SRC=null;setMode(inApp()?'app':'code',true)}
 else if(d==='force'){if(PROBE[cur.id])PROBE[cur.id].force=true;frame.dataset.id='';setMode(inApp()?'app':'code')}
 else if(d==='tab')window.open(cur.file,'_blank','noopener');
 else if(d==='pick')$('#srcFile').click()});
$('#srcFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!cur)return;const text=await f.text();PROBE[cur.id]={tried:[{u:f.name,status:200,bytes:text.length}],url:URL.createObjectURL(new Blob([text],{type:'text/html'})),text,bytes:new Blob([text]).size,problem:null,local:true};SRC=null;frame.dataset.id='';setMode(inApp()?'app':'code')};

/* ---------- sumber kode ---------- */
async function showCode(x,force){const my=++tok;$('#frame').style.display='none';
 if(!force&&SRC&&SRC.id===x.id){setLoad(false);return}
 setLoad(true,t('loadingCode'));const r=await probe(x,force);if(my!==tok||cur!==x)return;setLoad(false);
 if(!r.text){SRC=null;$('#cview').innerHTML=diagHtml(x,r);return}
 SRC={id:x.id,text:r.text,lines:r.text.split('\n'),shown:0,hits:[],hi:-1,term:''};renderCodeHead();
 $('#cview').innerHTML=r.problem&&!r.local?'<div class="cwarn">'+esc(diagMsg(x,r))+'</div>':'';renderMore(300)}
function renderCodeHead(){if(!SRC)return;const pr=cur&&PROBE[cur.id];$('#vSub').textContent=cur?(pr&&pr.url&&!pr.local?pr.url:cur.file)+' · '+t('lines').replace('{n}',SRC.lines.length.toLocaleString())+' · '+fmtB(new Blob([SRC.text]).size):''}
const LIM=1400;
function lineHtml(n,raw,term){const cut=raw.length>LIM,s=cut?raw.slice(0,LIM):raw;let h=esc(s);
 if(s.length<=500){h=h.replace(/(&lt;!--.*?--&gt;)/g,'<span class="c">$1</span>').replace(/(&lt;\/?)([a-zA-Z][\w-]*)/g,'$1<span class="t">$2</span>').replace(/(&quot;[^&]*?&quot;)/g,'<span class="s">$1</span>')}
 if(term){const re=new RegExp(esc(term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');h=h.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.split(/(&(?:amp|lt|gt|quot);)/).map(seg=>/^&(?:amp|lt|gt|quot);$/.test(seg)?seg:seg.replace(re,x=>'<mark>'+x+'</mark>')).join(''))}
 return '<div class="ln" id="L'+n+'"><i>'+(n+1)+'</i><code>'+h+'</code>'+(cut?'<button class="more" data-n="'+n+'">'+esc(t('cut').replace('{n}',(raw.length-LIM).toLocaleString()))+'</button>':'')+'</div>'}
function renderMore(k){if(!SRC)return;const v=$('#cview'),old=v.querySelector('.loadmore');if(old)old.remove();let h='';const end=Math.min(SRC.lines.length,SRC.shown+k);for(let n=SRC.shown;n<end;n++)h+=lineHtml(n,SRC.lines[n],'');SRC.shown=end;v.insertAdjacentHTML('beforeend',h);
 if(SRC.shown<SRC.lines.length){v.insertAdjacentHTML('beforeend','<button class="btn loadmore" id="lm">'+esc(t('more'))+' ('+(SRC.lines.length-SRC.shown).toLocaleString()+')</button>');obs.observe($('#lm'))}}
const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){obs.unobserve(e.target);renderMore(400)}})},{root:null,rootMargin:'600px'});
$('#cview').onclick=e=>{const b=e.target.closest('.more');if(b){const n=+b.dataset.n,ln=b.parentNode;ln.querySelector('code').innerHTML=esc(SRC.lines[n]);b.remove()}const l=e.target.closest('#lm');if(l)renderMore(500)};
let sT=0;$('#cq').oninput=()=>{clearTimeout(sT);sT=setTimeout(doSearch,200)};
function doSearch(){if(!SRC)return;const term=$('#cq').value;if(SRC.prev!=null)replaceLine(SRC.prev,'');SRC.prev=null;SRC.term=term;SRC.hits=[];SRC.hi=-1;if(term.length<2){$('#cCnt').textContent='0/0';return}const lo=term.toLowerCase();SRC.lines.forEach((l,i)=>{if(l.toLowerCase().includes(lo))SRC.hits.push(i)});$('#cCnt').textContent=SRC.hits.length?'0/'+SRC.hits.length:'0/0';if(SRC.hits.length)goHit(1)}
function replaceLine(n,term){const el=$('#L'+n);if(el)el.outerHTML=lineHtml(n,SRC.lines[n],term)}
function goHit(d){if(!SRC||!SRC.hits.length)return;SRC.hi=(SRC.hi+d+SRC.hits.length)%SRC.hits.length;const n=SRC.hits[SRC.hi];if(SRC.prev!=null)replaceLine(SRC.prev,'');if(n>=SRC.shown)renderMore(n-SRC.shown+60);replaceLine(n,SRC.term);const e=$('#L'+n);if(!e)return;e.classList.add('hit');SRC.prev=n;e.scrollIntoView({block:'center'});$('#cCnt').textContent=(SRC.hi+1)+'/'+SRC.hits.length}
$('#cNext').onclick=()=>goHit(1);$('#cPrev').onclick=()=>goHit(-1);$('#cq').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();goHit(e.shiftKey?-1:1)}};
$('#cCopy').onclick=async()=>{if(!SRC)return;try{await navigator.clipboard.writeText(SRC.text);toast(t('copied'))}catch(e){try{const a=document.createElement('textarea');a.value=SRC.text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast(t('copied'))}catch(x){toast(t('copyFail'))}}};
$('#cTidy').onclick=async()=>{if(!SRC)return;const b=$('#cTidy');
 if(SRC.orig){SRC.text=SRC.orig;SRC.orig=null;b.classList.remove('on')}
 else{b.disabled=true;toast(t('tidying'));try{const f=await tidy(SRC.text);SRC.orig=SRC.text;SRC.text=f;b.classList.add('on')}catch(e){toast(t('tidyFail'))}b.disabled=false;if(!SRC.orig)return}
 SRC.lines=SRC.text.split('\n');SRC.shown=0;SRC.hits=[];SRC.hi=-1;SRC.prev=null;$('#cview').innerHTML='';$('#cq').value='';$('#cCnt').textContent='0/0';renderCodeHead();renderMore(300)};
$('#cWrap').onclick=()=>{$('#cview').classList.toggle('wr');$('#cWrap').classList.toggle('on')};
let fs=13;const setFs=d=>{fs=Math.max(9,Math.min(24,fs+d));$('#cview').style.setProperty('--fs',fs+'px')};$('#cFm').onclick=()=>setFs(-1);$('#cFp').onclick=()=>setFs(1);
/* ---------- perapi kode: Prettier (seperti Acode), dimuat saat dibutuhkan ---------- */
const PRETTIER='https://cdn.jsdelivr.net/npm/prettier@3.6.2/';
let PR=null;
const loadPrettier=()=>PR||(PR=Promise.all(['standalone.mjs','plugins/html.mjs','plugins/postcss.mjs','plugins/babel.mjs','plugins/estree.mjs'].map(f=>import(PRETTIER+f))).catch(e=>{PR=null;throw e}));
async function tidy(text){
 const [p,...pl]=await loadPrettier(),keep=[];
 /* pustaka pihak ketiga yang sudah di-minify (satu baris raksasa) dibiarkan utuh */
 const src=text.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,m=>m.length>600000||/[^\n]{8000,}/.test(m)?(keep.push(m),'<!--KEEP'+(keep.length-1)+'-->'):m);
 const out=await p.format(src,{parser:'html',plugins:pl,tabWidth:2,printWidth:100});
 return out.replace(/<!--KEEP(\d+)-->/g,(_,i)=>keep[i]);
}

async function downloadSrc(x){const r=await probe(x);if(!r.text){toast(diagMsg(x,r)||t('codeFail'));return}if(r.problem&&r.problem!=='small'){toast(diagMsg(x,r));return}
 let text=r.text,ok=false;toast(t('tidying'));
 try{text=await tidy(text);ok=true}catch(e){}
 const blob=new Blob([text],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=x.file.split('/').pop();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),6000);toast(t('downloaded')+': '+a.download+' · '+t(ok?'tidied':'notTidied'))}

applyTheme();applyLang();routeHash();
</script>

 ask:'Get code',codeIs:'Link code (short-lived):',linked:'Connected as',ctl:'Bot is ready',ctl3:'Bot controls',total:'Commands run',banned:'Blocked',top:'Top',
 restart:'Restart',unlink:'Unlink WhatsApp',unlinkQ:'Unlink WhatsApp from the bot? You will need to link again.',done:'Done',fail:'Failed',
 apiT:'Free API: send messages with a link',apiNote:'Replace KUNCI_API with the key from the bot terminal. Never share this key.',

const L=()=>BT[(typeof lang!=='undefined'&&BT[lang])?lang:'id'];
const $=s=>document.querySelector(s);
const el=(t,a,...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(n==='class')e.className=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(n,v)}for(const c of k.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e};
const store=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const getS=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const norm=u=>{u=String(u||'').trim().replace(/\/+$/,'');return/^https?:\/\/[^\s/]+/i.test(u)?u:''};
const dec=s=>{try{return decodeURIComponent(s)}catch(e){return s}};
/* link koneksi: https://panel/#bot=<alamat>&key=<kunci>  atau alamat biasa */
function parseLink(v){v=String(v||'').trim();const b=/[#?&]bot=([^&\s]+)/.exec(v),k=/[#?&]key=([^&\s]+)/.exec(v);return b?{base:norm(dec(b[1])),key:k?dec(k[1]):''}:{base:norm(v),key:''}}
const AV='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25d366"/><stop offset="1" stop-color="#128c7e"/></linearGradient></defs><rect width="64" height="64" fill="url(#g)"/><rect x="14" y="22" width="36" height="26" rx="9" fill="#fff"/><circle cx="25" cy="35" r="4" fill="#128c7e"/><circle cx="39" cy="35" r="4" fill="#128c7e"/><rect x="29" y="12" width="6" height="10" rx="3" fill="#fff"/><circle cx="32" cy="12" r="3.5" fill="#fff"/></svg>');
const DEMO={prefix:'.',list:[{name:'menu',usage:'menu',desc:'Tampilkan semua perintah',category:'Umum'},{name:'ping',usage:'ping',desc:'Cek kecepatan bot',category:'Umum'},{name:'stiker',usage:'stiker',desc:'Ubah gambar atau video jadi stiker',category:'Media'},{name:'hitung',usage:'hitung 2+2*5',desc:'Kalkulator',category:'Alat'}]};

let base=norm(getS('botBase'));
const S={pub:null,cmds:null,own:null,err:false,sess:null,sig:'',demo:'menu'};
try{S.sess=JSON.parse(getS('botSession')||'null')}catch(e){}
if(S.sess&&(!S.sess.s||S.sess.exp<Date.now()||S.sess.base!==base))S.sess=null;

async function api(path,o={}){
  if(!base)throw new Error('no-base');
  const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);
  try{
    const r=await fetch(base+path,{method:o.method||'GET',signal:c.signal,cache:'no-store',headers:Object.assign({},o.body?{'Content-Type':'application/json'}:{},S.sess&&path.startsWith('/api/owner')?{Authorization:'Bearer '+S.sess.s}:{}),body:o.body?JSON.stringify(o.body):undefined});
    let j=null;try{j=await r.json()}catch(e){}
    if(!j)throw new Error('bad-response');
    if(r.status===401&&path.startsWith('/api/owner')){S.sess=null;store('botSession',null);renderAll()}
    if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{status:r.status});
    return j;
  }finally{clearTimeout(t)}
}
const fmtUp=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+(h?h+'h ':'')+m+'m'};
const copy=v=>{const t=L();(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast(t.copied+': '+(v.length>40?v.slice(0,40)+'…':v)),()=>toast(v))};
const pre=txt=>el('div',{class:'bot-pre'},txt,el('button',{class:'btn',type:'button',onclick:()=>copy(txt)},L().copy));
const stage=()=>!base||S.err||!S.pub?1:!S.sess?2:!S.own||S.own.status!=='open'?3:4;

function renderHead(){
  const t=L(),st=S.pub&&S.pub.status,live=S.pub&&!S.err;let c='bad',x=t.off;
  if(live){if(st==='open'){c='ok';x=t.on}else if(st==='connecting'||st==='qr'||st==='logged_out'){c='wait';x=st==='qr'?t.qr:st==='logged_out'?t.out:t.wait}else x=t.closed}
  $('#botTitle').textContent=(live&&S.pub.name)||t.title;$('#botSub').textContent=t.sub;
  $('#botPill').className='bot-pill '+c;$('#botPill').lastChild.textContent=x;$('#botAvBox').classList.toggle('ok',c==='ok');
  $('#botByName').textContent=t.by+' '+((live&&S.pub.owner)||'Creator');
  $('#botApiSum').textContent='🔌 '+t.apiT;$('#botCmdSum').textContent='📋 '+t.cmdsT+(S.cmds?' ('+S.cmds.list.length+')':'');$('#botCq').placeholder=t.cq;
  const box=$('#botStats');box.textContent='';
  if(live){const p=S.pub;[['👑',t.owner,p.owner],['🛡️',t.mode,p.mode==='self'?t.self:t.public],['🧩',t.cmds,p.commands],['👥',t.users,p.users],['⏱️',t.up,fmtUp(p.uptime)]].forEach(([i,k,v])=>box.append(el('div',{class:'bt'},el('em',{},i),el('b',{},String(v)),el('small',{},k))))}
  box.hidden=!live;
  const s=$('#botSteps'),n=stage();s.textContent='';
  t.s.forEach((l,i)=>s.append(el('li',{class:i+1<n?'done':i+1===n?'cur':''},el('span',{class:'n'},i+1<n?'✓':String(i+1)),l)));
}
function renderCreatorBadge(){
  let b=$('#creatorBadge');
  if(S.sess){if(!b){b=el('div',{class:'creator',id:'creatorBadge'});const h=document.querySelector('.profile h1');h&&h.after(b)}b.textContent='👑 '+L().badge+' · '+(S.sess.owner||'')}
  else if(b)b.remove();
}
async function login(v){
  const t=L();
  try{const r=await api('/api/login',{method:'POST',body:{token:v}});S.sess={s:r.session,owner:r.owner,exp:Date.now()+r.expiresIn*1000,base};store('botSession',JSON.stringify(S.sess));toast(t.hi.replace('{n}',r.owner));renderAll();await pollOwner();return true}
  catch(e){toast(e.status===401?t.wrong:(e.message||t.loginFail));return false}
}
async function connect(v){
  const p=typeof v==='string'?parseLink(v):v;if(!p.base){toast(L().badUrl);return}
  if(p.base!==base){base=p.base;store('botBase',base);S.cmds=null;S.pub=null;S.own=null;S.sess=null;store('botSession',null)}
  S.err=false;renderAll();await pollStatus();
  if(p.key&&!S.err&&!S.sess)await login(p.key);else await pollOwner();
}
function resetBase(){base='';store('botBase',null);store('botSession',null);S.pub=S.own=S.sess=S.cmds=null;S.err=false;renderAll()}
const conLine=()=>el('div',{class:'bot-acts'},el('span',{class:'bot-hint'},L().conTo+' '+base),el('button',{class:'btn',type:'button',onclick:resetBase},L().change));

function renderOwner(force){
  const t=L(),box=$('#botOwnerBox'),o=S.own||{},n=stage();
  const sig=[n,!!S.err,o.status,o.qr&&o.qr.length,o.pairingCode,o.mode,o.me,o.users,o.totalCommands,lang].join('|');
  if(!force&&sig===S.sig)return;S.sig=sig;
  const keep=['#botKey','#botNum','#botLink'].map(s=>{const e=$(s);return e?[s,e.value,document.activeElement===e]:null}).filter(Boolean);
  box.textContent='';
  if(n===1){
    const link=el('input',{type:'text',id:'botLink',placeholder:t.linkPh,autocomplete:'off',spellcheck:'false','aria-label':t.linkLbl});
    const go=()=>connect(link.value);link.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
    const warn=base&&S.err?(location.protocol==='https:'&&/^http:\/\//i.test(base)&&!/^http:\/\/(localhost|127\.)/i.test(base)?t.mixed:t.offHint):'';
    box.append(
      el('div',{class:'bot-box'},el('h3',{},'🚀 '+t.runT),el('p',{},t.run),pre('cd bot\nnpm install\nnpm start')),
      el('div',{class:'bot-box'},el('h3',{},'🔗 '+t.linkT),
        el('div',{class:'bot-row'},el('label',{class:'bot-f'},el('span',{},t.linkLbl),link),el('button',{class:'btn violet',type:'button',onclick:go},t.connect)),
        el('div',{class:'bot-acts'},el('button',{class:'btn',type:'button',onclick:()=>{link.value='http://localhost:3000';go()}},t.tryLocal)),
        el('p',{class:'bot-hint'+(warn?' warn':'')},warn||t.linkHint)));
  }else if(n===2){
    const key=el('input',{type:'password',id:'botKey',placeholder:t.keyPh,autocomplete:'current-password','aria-label':t.keyLbl});
    const go=el('button',{class:'btn ok',type:'button',onclick:async()=>{if(!key.value)return;go.disabled=true;if(await login(key.value))key.value='';go.disabled=false}},t.enter);
    key.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});
    box.append(el('div',{class:'bot-box'},el('h3',{},'🔐 '+t.keyT),conLine(),el('div',{class:'bot-row'},el('label',{class:'bot-f'},el('span',{},t.keyLbl),key),go)));
  }else{
    const post=async(p,body)=>{try{await api(p,{method:'POST',body});toast(t.done);pollOwner()}catch(e){toast(t.fail+': '+e.message)}};
    if(n===3){
      const b=el('div',{class:'bot-box'},el('h3',{},'📲 '+t.pairT));
      if(o.qr&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(o.qr))b.append(el('img',{class:'bot-qr',src:o.qr,alt:'QR'}),el('p',{},t.scan));
      const num=el('input',{type:'tel',id:'botNum',placeholder:'6281234567890',inputmode:'numeric',autocomplete:'off','aria-label':'Nomor'});
      const ask=el('button',{class:'btn violet',type:'button',onclick:async()=>{ask.disabled=true;try{const r=await api('/api/owner/pair',{method:'POST',body:{number:num.value}});S.own=Object.assign(S.own||{},{pairingCode:r.code});renderOwner(true)}catch(e){toast(e.message)}ask.disabled=false}},t.ask);
      b.append(el('p',{},t.or),el('div',{class:'bot-row'},el('label',{class:'bot-f'},el('span',{},'6281234567890'),num),ask));
      if(o.pairingCode)b.append(el('p',{},t.codeIs),el('div',{class:'bot-code'},o.pairingCode));
      box.append(b);
    }
    const c=el('div',{class:'bot-box'},el('h3',{},(n===4?'✅ '+t.ctl:'🛠️ '+t.ctl3)+(o.me?' · '+t.linked+' +'+o.me:'')),conLine());
    if(S.own)c.append(el('p',{},t.total+': '+o.totalCommands+' · '+t.users+': '+o.users+' · '+t.banned+': '+o.banned+(o.top&&o.top.length?' · '+t.top+': '+o.top.map(x=>x[0]+' ('+x[1]+')').join(', '):'')));
    c.append(el('div',{class:'bot-acts'},el('span',{class:'bot-hint'},t.mode),el('div',{class:'seg',role:'group'},['public','self'].map(m=>el('button',{class:'btn'+(o.mode===m?' on':''),type:'button',onclick:()=>post('/api/owner/mode',{mode:m})},m==='self'?t.self:t.public)))),
      el('div',{class:'bot-acts'},
        el('button',{class:'btn amber',type:'button',onclick:()=>post('/api/owner/restart',{})},t.restart),
        el('button',{class:'btn danger',type:'button',onclick:()=>{if(confirm(t.unlinkQ))post('/api/owner/logout',{})}},t.unlink),
        el('button',{class:'btn',type:'button',onclick:async()=>{try{await api('/api/owner/logout-panel',{method:'POST',body:{}})}catch(e){}S.sess=null;S.own=null;store('botSession',null);renderAll()}},t.exit)));
    box.append(c);
  }
  keep.forEach(([s,v,f])=>{const e=$(s);if(e){e.value=v;if(f)e.focus()}});
}
/* pratinjau chat WhatsApp: contoh balasan dibuat dari daftar perintah asli bot */
function renderPhone(){
  const t=L(),C=S.cmds||DEMO,P=C.prefix,box=$('#botPhone'),live=S.pub&&!S.err;
  const cmd=C.list.find(c=>c.name===S.demo)||C.list[0];
  let reply;
  if(cmd.name==='menu'){const cats={};C.list.forEach(c=>(cats[c.category]=cats[c.category]||[]).push(P+c.name));reply='*MENU*\n'+Object.entries(cats).map(([k,v])=>'\n*'+k+'*\n'+v.join(' · ')).join('\n')}
  else reply='*'+P+cmd.usage+'*\n'+cmd.desc;
  const names=[...new Set(['menu'].concat(C.list.map(c=>c.name)))].filter(n=>C.list.some(c=>c.name===n)).slice(0,5);
  box.textContent='';
  box.append(
    el('div',{class:'ph-h'},el('img',{src:AV,alt:''}),el('div',{},el('b',{},(live&&S.pub.name)||'Shin Bot'),el('small',{class:live&&S.pub.status==='open'?'':'off'},live&&S.pub.status==='open'?t.on:t.closed))),
    el('div',{class:'ph-b'},el('div',{class:'bb me'},P+cmd.name),el('div',{class:'bb bot'},reply)),
    el('div',{class:'ph-c'},names.map(n=>el('button',{type:'button',class:n===cmd.name?'on':'',onclick:()=>{S.demo=n;renderPhone()}},P+n))));
}
function renderApi(){
  const t=L(),b=base||'http://localhost:3000',k='KUNCI_API',body=$('#botApiBody');body.textContent='';
  body.append(el('p',{class:'bot-hint'},t.apiNote),
    pre('GET '+b+'/api/send?key='+k+'&to=6281234567890&message=Halo'),
    pre('curl -X POST '+b+'/api/send \\\n  -H "Authorization: Bearer '+k+'" \\\n  -H "Content-Type: application/json" \\\n  -d \'{"to":"6281234567890","message":"Halo"}\''),
    pre('fetch("'+b+'/api/send",{method:"POST",\n  headers:{Authorization:"Bearer '+k+'","Content-Type":"application/json"},\n  body:JSON.stringify({to:"6281234567890",message:"Halo"})})'));
}
function renderCmds(){
  const t=L(),box=$('#botCmdList');box.textContent='';
  if(!S.cmds)return;
  const q=$('#botCq').value.trim().toLowerCase(),cats={};
  S.cmds.list.forEach(c=>{if(q&&!(c.name+' '+c.desc+' '+c.usage+' '+(c.aliases||[]).join(' ')).toLowerCase().includes(q))return;(cats[c.category]=cats[c.category]||[]).push(c)});
  const ks=Object.keys(cats);if(!ks.length){box.append(el('p',{class:'bot-hint'},t.none));return}
  box.append(el('p',{class:'bot-hint'},t.tap));
  ks.forEach(k=>{box.append(el('div',{class:'bot-cat'},k));cats[k].forEach(c=>box.append(el('button',{class:'bot-cmd',type:'button',onclick:()=>copy(S.cmds.prefix+c.usage)},el('code',{},S.cmds.prefix+c.usage),el('span',{},c.desc))))});
}
function renderAll(){renderHead();renderCreatorBadge();renderOwner(true);renderPhone();renderApi();renderCmds()}

let busyS=false;
async function pollStatus(){
  if(busyS||!base||document.hidden)return;busyS=true;
  try{S.pub=await api('/api/status');S.err=false;if(!S.cmds){try{S.cmds=await api('/api/commands');renderPhone();renderCmds()}catch(e){}}}catch(e){S.err=true}
  busyS=false;renderHead();renderOwner();
}
async function pollOwner(){
  if(!S.sess||S.err||document.hidden||!base)return;
  try{S.own=await api('/api/owner/state');renderHead();renderOwner()}catch(e){}
  renderCreatorBadge();
}
$('#botCq').addEventListener('input',renderCmds);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollStatus().then(pollOwner)});
const _al=applyLang;applyLang=function(){_al.apply(this,arguments);renderAll()};

(async function init(){
  $('#botAv').src=AV;$('#botBy').src=document.getElementById('profileImg').currentSrc||document.getElementById('profileImg').src;
  const hash=/^#bot=/.test(location.hash)?parseLink(location.hash):null;
  if(hash)history.replaceState(null,'',location.pathname+location.search);
  if(!base&&!hash&&/^https?:$/.test(location.protocol)&&(location.port||location.hostname==='localhost')){ // dilayani langsung oleh server bot? coba alamat asal yang sama
    try{const c=new AbortController();setTimeout(()=>c.abort(),2500);const r=await fetch(location.origin+'/api/status',{signal:c.signal,cache:'no-store'});const j=await r.json();if(r.ok&&j&&j.name&&'status' in j){base=location.origin;store('botBase',base)}}catch(e){}
  }
  renderAll();
  if(hash&&hash.base){await connect(hash);$('#botSec').scrollIntoView({behavior:'smooth',block:'start'})}
  else if(base){await pollStatus();await pollOwner()}
  setInterval(()=>{pollStatus().then(()=>{if(S.sess&&(!S.own||S.own.status!=='open'||Date.now()%3===0))pollOwner()})},4000);
  setInterval(pollOwner,6000);
})();
})();
