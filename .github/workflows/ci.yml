name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hasil di tools/, index.html, dan sw.js harus identik dengan hasil build dari sumber di build/.
  build:
    name: build-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hasil build konsisten dengan sumber
        run: python3 build/build.py --check
      - name: Build ulang tidak mengubah berkas (idempoten)
        run: |
          python3 build/build.py
          python3 build/build.py
          git diff --exit-code -- index.html sw.js tools/

  bot:
    name: bot-tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: Pasang ffmpeg (untuk tes efek media)
        working-directory: .
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm test

  # Chromium wajib lulus. Firefox/WebKit (Safari) tetap dijalankan, tetapi belum memblokir sampai terbukti stabil di CI.
  ui:
    name: ui-tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bot/package-lock.json
            tests/package-lock.json
      - run: pip install -r tests/requirements.txt
      - run: python3 -m playwright install --with-deps ${{ matrix.browser }}
      - run: npm ci
        working-directory: bot
      - run: npm ci
        working-directory: tests
      - name: UI smoke
        run: python3 tests/ui_smoke.py --browser ${{ matrix.browser }}
      - name: PWA offline + pembaruan cache
        run: python3 tests/pwa_update.py --browser ${{ matrix.browser }}
      - name: Panel bot (tanpa WhatsApp nyata)
        run: python3 tests/panel_e2e.py --browser ${{ matrix.browser }}
      - name: Aksesibilitas
        run: python3 tests/a11y.py --browser ${{ matrix.browser }}

  # Satu status tunggal untuk dijadikan "required check" di branch protection.
  gate:
    name: ci-gate
    if: always()
    needs: [build, bot, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Semua pekerjaan wajib harus sukses
        run: |
          echo "build=${{ needs.build.result }} bot=${{ needs.bot.result }} ui=${{ needs.ui.result }}"
          [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.bot.result }}" = "success" ] && [ "${{ needs.ui.result }}" = "success" ]
